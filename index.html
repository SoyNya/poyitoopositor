  {
    id:"1-7", titulo:"Consejo de Derechos Humanos de la ONU.",
    contenidoEstudio:"<h4>Concepto</h4><p>El <b>Consejo de Derechos Humanos</b> es un órgano intergubernamental del sistema de Naciones Unidas encargado de promover y proteger los derechos humanos en todo el mundo.</p><p>Fue creado por la Asamblea General mediante la <b>Resolución 60/251, de 15 de marzo de 2006</b>, sustituyendo a la antigua Comisión de Derechos Humanos.</p><p>Tiene su sede en <b>Ginebra</b>.</p><h4>Composición</h4><p>Está integrado por <b>47 Estados miembros</b> de Naciones Unidas.</p><p>Los miembros son elegidos por la Asamblea General mediante votación directa e individual.</p><p>Los puestos se distribuyen geográficamente de acuerdo con la siguiente composición:</p><ul class='clean'><li>13 para Estados africanos.</li><li>13 para Estados de Asia y el Pacífico.</li><li>6 para Estados de Europa Oriental.</li><li>8 para Estados de América Latina y el Caribe.</li><li>7 para Estados de Europa Occidental y otros Estados.</li></ul><p>Los miembros son elegidos por un período de <b>tres años</b> y no pueden ser reelegidos inmediatamente después de haber ejercido <b>dos mandatos consecutivos</b>.</p><h4>Funciones</h4><p>Entre sus funciones se encuentran:</p><ul class='clean'><li>Promover el respeto universal de los derechos humanos.</li><li>Abordar situaciones de violaciones de derechos humanos.</li><li>Formular recomendaciones.</li><li>Promover la educación y formación en derechos humanos.</li><li>Coordinar e integrar los derechos humanos en el sistema de Naciones Unidas.</li><li>Realizar el Examen Periódico Universal.</li><li>Crear procedimientos especiales para determinados países o materias.</li><li>Recibir y examinar determinadas comunicaciones relativas a patrones consistentes de violaciones graves y fehacientemente probadas.</li></ul><h4>Examen Periódico Universal</h4><p>El <b>Examen Periódico Universal (EPU)</b> es un mecanismo mediante el cual se examina periódicamente la situación de los derechos humanos en <b>todos los Estados miembros de Naciones Unidas</b>.</p><p>Su finalidad es evaluar el cumplimiento de las obligaciones y compromisos de cada Estado y formular recomendaciones.</p><p>Es un mecanismo de carácter universal, basado en la cooperación y el diálogo entre Estados.</p><h4>Procedimientos especiales</h4><p>El Consejo puede establecer:</p><ul class='clean'><li>Relatores especiales.</li><li>Expertos independientes.</li><li>Grupos de trabajo.</li></ul><p>Estos mecanismos estudian determinadas situaciones nacionales o cuestiones temáticas relacionadas con los derechos humanos.</p>",
    conceptos:[],
    normativa:[{norma:"Resolución 60/251 de la Asamblea General de la ONU", detalle:"15 de marzo de 2006. Crea el Consejo de Derechos Humanos como órgano subsidiario de la Asamblea General.", url:"https://www.ohchr.org/es/ohchr_homepage"}],
    datos:["Creación: 15 de marzo de 2006, Resolución 60/251 de la AG","47 Estados miembros, mandato de 3 años, máx. 2 mandatos consecutivos","Distribución geográfica: África 13, Asia-Pacífico 13, Europa Oriental 6, América Latina y Caribe 8, Europa Occidental y otros 7 (total 47)","Sede: Ginebra","Mecanismos propios: EPU, Procedimientos Especiales, procedimiento de comunicaciones"],
    advertencias:["No confundas la sede del Consejo de Derechos Humanos (Ginebra) con la de la Asamblea General y el Consejo de Seguridad (Nueva York).","La distribución geográfica de los 47 puestos (13-13-6-8-7) es un dato muy preguntable: suma exactamente 47.","No confundas el Consejo de Derechos Humanos (Estados como miembros) con el Comité de Derechos Humanos (expertos independientes del PIDCP, apartado 1-6)."],
    fuentes:[{texto:"OHCHR (Oficina del Alto Comisionado de la ONU para los Derechos Humanos)", url:"https://www.ohchr.org/es/ohchr_homepage"}],
    resumen:"<p><b>Creado 15-III-2006</b>, Res. 60/251 · 47 miembros (3 años, máx. 2 mandatos) · sede Ginebra.</p><p>Reparto: África 13, Asia-Pacífico 13, Europa Oriental 6, AL y Caribe 8, Europa Occ. y otros 7.</p><p>Mecanismos: EPU, Procedimientos Especiales, comunicaciones.</p>"
  },
  {
    id:"1-8", titulo:"Convención contra la tortura y otros tratos o penas crueles, inhumanas o degradantes, de la Asamblea General de Naciones Unidas.",
    contenidoEstudio:"<h4>Concepto y finalidad</h4><p>La <b>Convención contra la Tortura y Otros Tratos o Penas Crueles, Inhumanos o Degradantes</b> fue adoptada por la Asamblea General de las Naciones Unidas el <b>10 de diciembre de 1984</b>.</p><p>Su finalidad es prevenir y combatir la tortura y otros tratos o penas crueles, inhumanos o degradantes.</p><h4>Concepto de tortura</h4><p>A efectos de la Convención, se entiende por tortura todo acto por el cual se inflija intencionadamente a una persona dolores o sufrimientos graves, físicos o mentales, con determinadas finalidades, entre ellas:</p><ul class='clean'><li>Obtener información o una confesión.</li><li>Castigar por un acto cometido o sospechado.</li><li>Intimidar o coaccionar.</li><li>Por cualquier razón basada en discriminación.</li></ul><p>Debe existir intervención o consentimiento o aquiescencia de un funcionario público u otra persona que actúe en ejercicio de funciones oficiales.</p><p>No se consideran tortura los dolores o sufrimientos que sean consecuencia únicamente de sanciones legítimas o inherentes a ellas, dentro de los límites internacionales aplicables.</p><h4>Prohibición absoluta</h4><p>La tortura está prohibida de manera absoluta. No puede justificarse por:</p><ul class='clean'><li>Estado de guerra.</li><li>Amenaza de guerra.</li><li>Inestabilidad política.</li><li>Emergencia pública.</li><li>Orden de un superior.</li></ul><h4>Principio de no devolución</h4><p>Un Estado parte no puede expulsar, devolver o extraditar a una persona a otro Estado cuando existan razones fundadas para creer que estaría en peligro de ser sometida a tortura.</p><h4>Investigación</h4><p>Los Estados deben garantizar que las autoridades competentes realicen una investigación pronta e imparcial cuando existan motivos razonables para creer que se ha cometido un acto de tortura.</p><h4>Formación</h4><p>Los Estados deben incorporar la prohibición de la tortura en la formación del personal que pueda participar en:</p><ul class='clean'><li>Interrogatorios.</li><li>Detenciones.</li><li>Custodia.</li><li>Tratamiento de personas privadas de libertad.</li></ul><p>Esta obligación resulta especialmente relevante para las Fuerzas y Cuerpos de Seguridad y demás personal relacionado con la custodia de detenidos.</p><h4>Comité contra la Tortura</h4><p>La Convención crea el <b>Comité contra la Tortura</b>, encargado de supervisar su aplicación.</p><p>El Comité examina los informes presentados por los Estados parte y puede ejercer otras funciones previstas en la Convención cuando el Estado haya aceptado los mecanismos correspondientes.</p>",
    conceptos:[],
    normativa:[{norma:"Convención contra la Tortura", detalle:"Asamblea General de la ONU, 10 de diciembre de 1984. Art. 1 (definición), art. 3 (no devolución), art. 17 (Comité contra la Tortura).", url:"https://www.boe.es/buscar/doc.php?id=BOE-A-1987-25053"}],
    datos:["Adopción: 10 de diciembre de 1984","Definición de tortura (art. 1): dolor/sufrimiento grave, intencionado, con intervención o aquiescencia de un funcionario público, con una finalidad específica","No justificable ni por guerra, ni emergencia pública, ni orden de un superior","Principio de no devolución (non-refoulement)","Comité contra la Tortura: supervisa la aplicación mediante informes de los Estados"],
    advertencias:["La definición de tortura exige intervención o aquiescencia de un funcionario público: no equivale a cualquier violencia entre particulares.","Ninguna circunstancia (ni guerra, ni orden de un superior) justifica la tortura: es una prohibición absoluta, sin excepciones.","No confundas esta Convención (obligaciones de prevenir, investigar y sancionar la tortura ya cometida) con su Protocolo Facultativo (apartado 1-9, sistema preventivo de visitas)."],
    fuentes:[{texto:"BOE-A-1987-25053, Instrumento de Ratificación de España de la Convención contra la Tortura", url:"https://www.boe.es/buscar/doc.php?id=BOE-A-1987-25053"}],
    resumen:"<p><b>Adoptada 10-XII-1984.</b> Tortura = dolor/sufrimiento grave intencionado + funcionario público + finalidad específica. Prohibición absoluta (sin excepciones). No devolución. Comité contra la Tortura supervisa mediante informes.</p>"
  },
  {
    id:"1-9", titulo:"Protocolo facultativo de la Convención contra la tortura y otros tratos o penas crueles, inhumanas o degradantes, de la Asamblea General de Naciones Unidas.",
    contenidoEstudio:"<h4>Finalidad</h4><p>El <b>Protocolo Facultativo de la Convención contra la Tortura (OPCAT)</b> fue adoptado en Nueva York el <b>18 de diciembre de 2002</b>.</p><p>España lo ratificó y el Protocolo entró en vigor para España el <b>22 de junio de 2006</b>.</p><p>Su finalidad es reforzar la prevención de la tortura mediante un sistema de <b>visitas periódicas a lugares donde se encuentren personas privadas de libertad</b>.</p><h4>Sistema preventivo</h4><p>El Protocolo establece un sistema basado en dos niveles:</p><ul class='clean'><li>Un mecanismo internacional.</li><li>Mecanismos nacionales de prevención.</li></ul><p>Las visitas tienen carácter preventivo y pretenden detectar situaciones que puedan favorecer la tortura o los malos tratos.</p><h4>Subcomité para la Prevención de la Tortura</h4><p>El Protocolo crea el <b>Subcomité para la Prevención de la Tortura y Otros Tratos o Penas Crueles, Inhumanos o Degradantes</b>.</p><p>El Subcomité:</p><ul class='clean'><li>Realiza visitas a lugares de privación de libertad.</li><li>Formula recomendaciones a los Estados.</li><li>Coopera con los mecanismos nacionales de prevención.</li><li>Trabaja conforme a los principios de confidencialidad, imparcialidad, no selectividad, universalidad y objetividad.</li></ul><p>El objetivo fundamental es prevenir, no sustituir, los mecanismos nacionales de investigación y sanción.</p><h4>Mecanismos nacionales de prevención</h4><p>Cada Estado parte debe establecer, designar o mantener uno o varios <b>mecanismos nacionales independientes para la prevención de la tortura</b>.</p><p>Estos mecanismos realizan visitas periódicas a lugares donde haya personas privadas de libertad.</p><h4>Lugares de privación de libertad</h4><p>El concepto comprende los lugares donde una persona está o puede estar privada de libertad por orden de una autoridad pública o con su consentimiento o aquiescencia.</p><p>Las visitas permiten examinar:</p><ul class='clean'><li>Condiciones de detención.</li><li>Trato recibido.</li><li>Garantías existentes.</li><li>Medidas de prevención.</li><li>Riesgos de tortura o malos tratos.</li></ul><h4>Mecanismo Nacional de Prevención de la Tortura en España</h4><p>En España las funciones de <b>Mecanismo Nacional de Prevención de la Tortura (MNP)</b> corresponden al <b>Defensor del Pueblo</b>.</p><p>El MNP realiza visitas preventivas a centros de privación de libertad y formula recomendaciones para mejorar las condiciones y prevenir la tortura y otros malos tratos.</p><p>El MNP cuenta con un <b>Consejo Asesor</b> como órgano de cooperación técnica y jurídica.</p>",
    conceptos:[],
    normativa:[{norma:"Protocolo Facultativo de la Convención contra la Tortura (OPCAT)", detalle:"Nueva York, 18 de diciembre de 2002. Entrada en vigor para España: 22 de junio de 2006.", url:"https://www.boe.es/buscar/doc.php?id=BOE-A-2006-11128"}],
    datos:["Adopción: 18 de diciembre de 2002 (Nueva York) · Entrada en vigor para España: 22 de junio de 2006","Doble nivel: Subcomité para la Prevención de la Tortura (internacional) + Mecanismos Nacionales de Prevención (internos)","Principios del Subcomité: confidencialidad, imparcialidad, no selectividad, universalidad, objetividad","En España, el MNP corresponde al Defensor del Pueblo, con un Consejo Asesor propio"],
    advertencias:["El OPCAT es preventivo, no sustituye a las investigaciones penales cuando ya existen indicios de delito de tortura.","No confundas el Subcomité para la Prevención de la Tortura (órgano internacional creado por el OPCAT) con el Comité contra la Tortura (órgano de la Convención de 1984, apartado 1-8, examina informes y denuncias).","España ratificó el OPCAT y su entrada en vigor para España coincidió con la entrada en vigor general (22 de junio de 2006): no lo confundas con la fecha de adopción (2002) ni con la de la firma española (2005)."],
    fuentes:[{texto:"BOE-A-2006-11128, Instrumento de Ratificación de España del OPCAT", url:"https://www.boe.es/buscar/doc.php?id=BOE-A-2006-11128"}],
    resumen:"<p><b>Adoptado 18-XII-2002</b> · vigor España: 22-VI-2006.</p><p>Sistema preventivo de visitas: Subcomité internacional + Mecanismos Nacionales de Prevención. En España: Defensor del Pueblo + Consejo Asesor.</p>"
  },
  {
    id:"1-10", titulo:"Carta de los Derechos Fundamentales de la Unión Europea.",
    contenidoEstudio:"<h4>Naturaleza y origen</h4><p>La <b>Carta de los Derechos Fundamentales de la Unión Europea</b> fue proclamada inicialmente en <b>Niza el 7 de diciembre de 2000</b>.</p><p>La versión actualmente jurídicamente vinculante fue proclamada en <b>Estrasburgo el 12 de diciembre de 2007</b>.</p><p>Con la entrada en vigor del <b>Tratado de Lisboa el 1 de diciembre de 2009</b>, la Carta adquirió el mismo valor jurídico que los Tratados de la Unión Europea.</p><p>La Carta reúne en un único instrumento derechos civiles, políticos, económicos y sociales reconocidos en el ámbito de la Unión.</p><h4>Estructura</h4><p>La Carta contiene un <b>Preámbulo, 54 artículos y siete títulos</b>:</p><ol class='clean'><li><b>Dignidad.</b></li><li><b>Libertades.</b></li><li><b>Igualdad.</b></li><li><b>Solidaridad.</b></li><li><b>Ciudadanía.</b></li><li><b>Justicia.</b></li><li><b>Disposiciones generales</b> que rigen la interpretación y aplicación de la Carta.</li></ol><h4>Dignidad</h4><p>El Título I protege:</p><ul class='clean'><li>Dignidad humana.</li><li>Derecho a la vida.</li><li>Derecho a la integridad de la persona.</li><li>Prohibición de la tortura y de los tratos o penas inhumanos o degradantes.</li><li>Prohibición de la esclavitud y del trabajo forzado.</li></ul><h4>Libertades</h4><p>El Título II reconoce, entre otros:</p><ul class='clean'><li>Derecho a la libertad y seguridad.</li><li>Respeto de la vida privada y familiar.</li><li>Protección de datos personales.</li><li>Derecho a contraer matrimonio y fundar una familia.</li><li>Libertad de pensamiento, conciencia y religión.</li><li>Libertad de expresión.</li><li>Libertad de reunión y asociación.</li><li>Libertad de las artes y las ciencias.</li><li>Derecho a la educación.</li><li>Libertad profesional y derecho a trabajar.</li><li>Libertad de empresa.</li><li>Derecho de propiedad.</li><li>Derecho de asilo.</li><li>Protección frente a expulsiones, devoluciones o extradiciones contrarias a la Carta.</li></ul><h4>Igualdad</h4><p>El Título III comprende:</p><ul class='clean'><li>Igualdad ante la ley.</li><li>Prohibición de discriminación.</li><li>Respeto de la diversidad cultural, religiosa y lingüística.</li><li>Igualdad entre mujeres y hombres.</li><li>Derechos del niño.</li><li>Derechos de las personas mayores.</li><li>Integración de las personas con discapacidad.</li></ul><h4>Solidaridad</h4><p>El Título IV reconoce derechos sociales y laborales, entre ellos:</p><ul class='clean'><li>Derecho de información y consulta de los trabajadores.</li><li>Negociación colectiva y acción colectiva.</li><li>Protección frente al despido injustificado.</li><li>Condiciones de trabajo justas y equitativas.</li><li>Prohibición del trabajo infantil.</li><li>Protección de la familia.</li><li>Seguridad social y ayuda social.</li><li>Protección de la salud.</li><li>Protección del medio ambiente.</li><li>Protección de los consumidores.</li></ul><h4>Ciudadanía</h4><p>El Título V reconoce derechos relacionados con la ciudadanía de la Unión:</p><ul class='clean'><li>Derecho a votar y ser elegido en las elecciones al Parlamento Europeo.</li><li>Derecho a votar y ser elegido en elecciones municipales.</li><li>Derecho a una buena administración.</li><li>Derecho de acceso a documentos.</li><li>Derecho de petición al Parlamento Europeo.</li><li>Derecho a recurrir al Defensor del Pueblo Europeo.</li><li>Libertad de circulación y residencia.</li><li>Protección diplomática y consular.</li></ul><h4>Justicia</h4><p>El Título VI comprende:</p><ul class='clean'><li>Derecho a la tutela judicial efectiva.</li><li>Derecho a un juez imparcial.</li><li>Presunción de inocencia.</li><li>Derechos de defensa.</li><li>Principios de legalidad y proporcionalidad de los delitos y las penas.</li><li>Derecho a no ser juzgado o condenado penalmente dos veces por el mismo delito (<i>non bis in idem</i>).</li></ul><h4>Ámbito de aplicación</h4><p>La Carta se aplica a:</p><ul class='clean'><li>Las instituciones, órganos y organismos de la Unión.</li><li>Los Estados miembros <b>únicamente cuando apliquen el Derecho de la Unión</b>.</li></ul><p>La Carta no amplía las competencias de la Unión.</p><h4>Interpretación y nivel de protección</h4><p>Los derechos reconocidos deben interpretarse conforme a las disposiciones generales de la Carta y respetando el nivel de protección establecido.</p><p>Cuando un derecho corresponda a derechos garantizados por el Convenio Europeo de Derechos Humanos, su sentido y alcance deben ser, como mínimo, los mismos que los reconocidos por el Convenio, sin impedir que el Derecho de la Unión proporcione una protección más amplia.</p>",
    conceptos:[],
    normativa:[{norma:"Carta de los Derechos Fundamentales de la Unión Europea", detalle:"Proclamada en Niza (7 de diciembre de 2000) y en Estrasburgo (12 de diciembre de 2007). Vinculante desde el Tratado de Lisboa (1 de diciembre de 2009). 54 artículos, 7 títulos.", url:"https://eur-lex.europa.eu"}],
    datos:["Proclamación en Niza: 7 de diciembre de 2000","Proclamación adaptada en Estrasburgo: 12 de diciembre de 2007","Entrada en vigor jurídica vinculante: 1 de diciembre de 2009 (Tratado de Lisboa)","54 artículos, 7 títulos: Dignidad, Libertades, Igualdad, Solidaridad, Ciudadanía, Justicia, Disposiciones generales","Ámbito de aplicación: instituciones de la UE + Estados miembros solo cuando aplican Derecho de la Unión"],
    advertencias:["Distingue las tres fechas: proclamación en Niza (2000, sin efectos vinculantes), proclamación adaptada en Estrasburgo (2007) y entrada en vigor vinculante con el Tratado de Lisboa (2009).","La Carta NO amplía las competencias de la Unión ni se aplica a los Estados miembros en cualquier actuación, solo cuando aplican Derecho de la UE.","Cuando un derecho de la Carta coincide con uno del CEDH, su nivel de protección debe ser, como mínimo, el mismo que el del Convenio."],
    fuentes:[{texto:"Carta de los Derechos Fundamentales de la UE, texto consolidado — eur-lex.europa.eu", url:"https://eur-lex.europa.eu"}],
    resumen:"<p><b>Niza, 7-XII-2000</b> → adaptada en Estrasburgo, 12-XII-2007 → vinculante desde Lisboa, 1-XII-2009.</p><p>54 artículos, 7 títulos: Dignidad, Libertades, Igualdad, Solidaridad, Ciudadanía, Justicia, Disp. generales.</p><p>Solo se aplica a Estados miembros cuando aplican Derecho de la UE.</p>"
  },
  {
    id:"1-11", titulo:"Estatuto de Roma de la Corte Penal Internacional.",
    contenidoEstudio:"<h4>Creación de la Corte Penal Internacional</h4><p>El <b>Estatuto de Roma de la Corte Penal Internacional (CPI)</b> fue adoptado en Roma el <b>17 de julio de 1998</b>.</p><p>La Corte Penal Internacional es una institución permanente e independiente con competencia sobre los crímenes más graves de trascendencia internacional.</p><p>El Estatuto entró en vigor el <b>1 de julio de 2002</b>.</p><p>España ratificó el Estatuto y este forma parte del ordenamiento jurídico español en los términos establecidos por el Derecho internacional y la Constitución.</p><h4>Principio de complementariedad</h4><p>La CPI tiene carácter <b>complementario</b> respecto de las jurisdicciones penales nacionales.</p><p>Esto significa que no sustituye automáticamente a los tribunales nacionales.</p><p>La Corte interviene cuando concurren las condiciones de competencia y admisibilidad establecidas en el Estatuto, especialmente cuando el Estado que tendría competencia no está dispuesto a llevar a cabo genuinamente la investigación o el enjuiciamiento o no puede hacerlo.</p><h4>Crímenes competencia de la Corte</h4><p>El artículo 5 establece cuatro categorías:</p><ol class='clean'><li><b>Genocidio.</b></li><li><b>Crímenes de lesa humanidad.</b></li><li><b>Crímenes de guerra.</b></li><li><b>Crimen de agresión.</b></li></ol><h4>Genocidio</h4><p>Consiste en determinados actos cometidos con la intención de destruir, total o parcialmente, un grupo nacional, étnico, racial o religioso. Entre los actos contemplados se encuentran:</p><ul class='clean'><li>Matanza de miembros del grupo.</li><li>Lesión grave a la integridad física o mental.</li><li>Sometimiento a condiciones de existencia destinadas a provocar su destrucción física.</li><li>Medidas destinadas a impedir nacimientos.</li><li>Traslado por la fuerza de niños del grupo a otro grupo.</li></ul><h4>Crímenes de lesa humanidad</h4><p>Comprenden determinados actos cuando forman parte de un <b>ataque generalizado o sistemático contra una población civil y con conocimiento de dicho ataque</b>. Entre ellos:</p><ul class='clean'><li>Asesinato.</li><li>Exterminio.</li><li>Esclavitud.</li><li>Deportación o traslado forzoso.</li><li>Encarcelación u otra privación grave de libertad.</li><li>Tortura.</li><li>Violación y otras formas graves de violencia sexual.</li><li>Persecución.</li><li>Desaparición forzada.</li><li>Apartheid.</li><li>Otros actos inhumanos de carácter similar.</li></ul><h4>Crímenes de guerra</h4><p>Comprenden graves infracciones de las normas aplicables en los conflictos armados, tanto internacionales como, en los términos del Estatuto, no internacionales. Incluyen determinadas conductas contra:</p><ul class='clean'><li>Personas protegidas.</li><li>Prisioneros.</li><li>Población civil.</li><li>Heridos y enfermos.</li><li>Bienes protegidos.</li></ul><h4>Crimen de agresión</h4><p>El crimen de agresión se refiere a la planificación, preparación, iniciación o realización, por una persona que esté en posición de controlar o dirigir efectivamente la acción política o militar de un Estado, de un acto de agresión que, por sus características, gravedad y escala, constituya una violación manifiesta de la Carta de Naciones Unidas.</p><h4>Competencia personal</h4><p>La Corte ejerce jurisdicción sobre <b>personas físicas</b>. No juzga Estados ni organizaciones como responsables penales ante la Corte. La responsabilidad penal es individual.</p><h4>Imprescriptibilidad</h4><p>Los crímenes de competencia de la Corte <b>no prescriben</b>.</p><h4>Órganos de la Corte</h4><p>La CPI está integrada, entre otros órganos, por:</p><ul class='clean'><li>Presidencia.</li><li>Secciones judiciales.</li><li>Fiscalía.</li><li>Secretaría.</li></ul><p>La <b>Fiscalía</b> actúa de manera independiente y se encarga de recibir información, realizar investigaciones y ejercer la acusación cuando corresponda.</p><h4>Asamblea de los Estados Partes</h4><p>La <b>Asamblea de los Estados Partes</b> es el órgano legislativo y de supervisión de la administración de la Corte. Está integrada por representantes de los Estados parte del Estatuto. Entre sus funciones se encuentran:</p><ul class='clean'><li>Aprobar el presupuesto.</li><li>Supervisar la administración.</li><li>Elegir determinados cargos y magistrados conforme al Estatuto.</li><li>Adoptar determinadas normas y decisiones.</li></ul>",
    conceptos:[],
    normativa:[{norma:"Estatuto de Roma de la Corte Penal Internacional", detalle:"Roma, 17 de julio de 1998. En vigor: 1 de julio de 2002. Art. 5 (crímenes), art. 17 (complementariedad).", url:"https://www.icc-cpi.int"}],
    datos:["Adopción: 17 de julio de 1998 · Entrada en vigor: 1 de julio de 2002","4 crímenes (art. 5): genocidio, lesa humanidad, guerra, agresión — imprescriptibles","Principio de complementariedad: la CPI actúa cuando el Estado no puede o no quiere investigar/juzgar genuinamente","Competencia personal: solo personas físicas, nunca Estados ni organizaciones","Órganos: Presidencia, Secciones judiciales, Fiscalía (independiente), Secretaría + Asamblea de los Estados Partes (órgano legislativo/supervisor)"],
    advertencias:["El principio de complementariedad significa que la CPI NO tiene prioridad sobre las jurisdicciones nacionales: actúa solo en defecto de estas.","La CPI juzga personas físicas, nunca Estados: la responsabilidad penal es siempre individual.","No confundas la Asamblea de los Estados Partes (órgano legislativo/administrativo, con representantes de los Estados) con la Fiscalía o las Secciones judiciales (órganos internos de la Corte)."],
    fuentes:[{texto:"Estatuto de Roma de la Corte Penal Internacional — icc-cpi.int", url:"https://www.icc-cpi.int"}],
    resumen:"<p><b>Roma, 17-VII-1998</b> · vigor 1-VII-2002.</p><p>4 crímenes (art. 5): genocidio, lesa humanidad, guerra, agresión — imprescriptibles. Complementariedad. Solo personas físicas. Órganos: Presidencia, Secciones, Fiscalía, Secretaría + Asamblea de Estados Partes.</p>"
  },
  {
    id:"1-12", titulo:"Ley Orgánica 18/2003, de 10 de diciembre, de Cooperación con la Corte Penal Internacional.",
    contenidoEstudio:"<h4>Finalidad</h4><p>La <b>Ley Orgánica 18/2003, de 10 de diciembre, de Cooperación con la Corte Penal Internacional</b>, establece el régimen de cooperación de España con la CPI.</p><p>Fue aprobada después de la ratificación por España del Estatuto de Roma.</p><p>El Estatuto de Roma fue autorizado para su ratificación por España mediante la <b>Ley Orgánica 6/2000, de 4 de octubre</b>.</p><h4>Principio general de cooperación</h4><p>España coopera con la Corte Penal Internacional en los términos previstos:</p><ul class='clean'><li>En el Estatuto de Roma.</li><li>En la propia Ley Orgánica 18/2003.</li><li>En las demás normas aplicables.</li></ul><p>La cooperación se realiza a través de las autoridades españolas competentes.</p><h4>Solicitudes de cooperación</h4><p>La Corte puede solicitar a España actuaciones necesarias para el ejercicio de sus funciones. La cooperación puede comprender, entre otras:</p><ul class='clean'><li>Detención y entrega de personas.</li><li>Notificaciones.</li><li>Obtención de pruebas.</li><li>Declaraciones.</li><li>Traslado de personas.</li><li>Registros y otras diligencias.</li><li>Localización e identificación.</li><li>Embargo o aseguramiento de bienes.</li><li>Ejecución de determinadas resoluciones.</li></ul><h4>Entrega a la Corte</h4><p>La entrega de una persona a la CPI debe realizarse conforme al Estatuto de Roma y al procedimiento previsto por el ordenamiento español.</p><p>Debe distinguirse la <b>entrega a la Corte Penal Internacional</b> de la extradición entre Estados.</p><h4>Cooperación judicial</h4><p>Las autoridades judiciales españolas participan en la ejecución de las solicitudes de cooperación cuando corresponda. La cooperación debe respetar:</p><ul class='clean'><li>Derechos fundamentales.</li><li>Garantías procesales.</li><li>Principios establecidos en el Estatuto de Roma.</li><li>Competencias de las autoridades españolas.</li></ul><h4>Competencia de la Corte y jurisdicción española</h4><p>La Ley establece mecanismos para coordinar la actuación de España y la CPI. El principio de complementariedad implica que la jurisdicción nacional mantiene un papel primordial respecto de los hechos que puedan ser competencia de la Corte.</p><h4>España como Estado de ejecución</h4><p>España puede cooperar en la ejecución de determinadas decisiones de la Corte en los términos previstos en el Estatuto y en los acuerdos internacionales aplicables. La cooperación puede comprender el cumplimiento de penas cuando concurran las condiciones establecidas.</p>",
    conceptos:[],
    normativa:[{norma:"Ley Orgánica 18/2003, de 10 de diciembre", detalle:"De Cooperación con la Corte Penal Internacional.", url:"https://www.boe.es/buscar/act.php?id=BOE-A-2003-22715"},{norma:"Ley Orgánica 6/2000, de 4 de octubre", detalle:"Autoriza la ratificación por España del Estatuto de Roma.", url:"https://www.boe.es/buscar/act.php?id=BOE-A-2000-17944"}],
    datos:["LO 18/2003, de 10 de diciembre: régimen de cooperación de España con la CPI","LO 6/2000, de 4 de octubre: autoriza la ratificación española del Estatuto de Roma (norma previa y distinta)","La entrega a la CPI se distingue de la extradición entre Estados","España puede actuar como Estado de ejecución de penas de la CPI"],
    advertencias:["No confundas la LO 6/2000 (autoriza la ratificación del Estatuto, año 2000) con la LO 18/2003 (regula la cooperación práctica con la Corte, año 2003): son dos leyes distintas y sucesivas.","La 'entrega' a la Corte Penal Internacional es una figura distinta de la extradición clásica entre Estados, aunque comparten similitudes procedimentales."],
    fuentes:[{texto:"BOE-A-2003-22715, Ley Orgánica 18/2003, de 10 de diciembre", url:"https://www.boe.es/buscar/act.php?id=BOE-A-2003-22715"},{texto:"BOE-A-2000-17944, Ley Orgánica 6/2000, de 4 de octubre", url:"https://www.boe.es/buscar/act.php?id=BOE-A-2000-17944"}],
    resumen:"<p><b>LO 6/2000</b> (4-X-2000): autoriza la ratificación del Estatuto de Roma.</p><p><b>LO 18/2003</b> (10-XII-2003): régimen de cooperación con la CPI (detención y entrega, pruebas, ejecución de resoluciones). Entrega ≠ extradición.</p>"
  },
  {
    id:"1-13", titulo:"Reglamento de Organización y Funcionamiento del Defensor del Pueblo, incluido el Consejo Asesor del Mecanismo Nacional de Prevención de Tortura.",
    contenidoEstudio:"<h4>Defensor del Pueblo</h4><p>El <b>Defensor del Pueblo</b> es el alto comisionado de las Cortes Generales encargado de la defensa de los derechos comprendidos en el Título I de la Constitución.</p><p>Supervisa la actividad de la Administración pública y da cuenta de su actividad a las Cortes Generales.</p><p>Su regulación fundamental se encuentra en la <b>Ley Orgánica 3/1981, de 6 de abril</b>, y en su Reglamento de Organización y Funcionamiento.</p><h4>Organización</h4><p>El Defensor del Pueblo ejerce sus funciones con independencia y autonomía. Cuenta con:</p><ul class='clean'><li>El Defensor del Pueblo.</li><li>Adjuntos.</li><li>Secretaría General.</li><li>Los órganos y servicios necesarios para el ejercicio de sus funciones.</li></ul><p>Los Adjuntos auxilian al Defensor del Pueblo en el ejercicio de sus funciones y pueden sustituirlo en los términos establecidos.</p><h4>Mecanismo Nacional de Prevención de la Tortura</h4><p>El Defensor del Pueblo ejerce las funciones de <b>Mecanismo Nacional de Prevención de la Tortura (MNP)</b> de acuerdo con el Protocolo Facultativo de la Convención contra la Tortura.</p><p>El MNP tiene carácter preventivo. Su objetivo es prevenir la tortura y otros tratos o penas crueles, inhumanos o degradantes mediante visitas periódicas a lugares de privación de libertad.</p><h4>Visitas del MNP</h4><p>El MNP puede visitar lugares donde se encuentren personas privadas de libertad. Estas visitas permiten:</p><ul class='clean'><li>Examinar las condiciones de privación de libertad.</li><li>Entrevistar a personas privadas de libertad.</li><li>Entrevistar al personal.</li><li>Examinar documentación.</li><li>Comprobar las condiciones materiales.</li><li>Detectar posibles factores de riesgo.</li><li>Formular recomendaciones.</li></ul><p>Las visitas tienen carácter preventivo y no sustituyen las investigaciones penales que correspondan cuando existan indicios de delito.</p><h4>Consejo Asesor del Mecanismo Nacional de Prevención de la Tortura</h4><p>El <b>Consejo Asesor del MNP</b> es un órgano de cooperación técnica y jurídica en el ámbito del Mecanismo Nacional de Prevención de la Tortura.</p><p>Su finalidad es asesorar y colaborar técnicamente con el MNP en el ejercicio de sus funciones.</p><p>Está presidido por el <b>Adjunto del Defensor del Pueblo que tenga atribuida la coordinación del MNP</b>, en los términos establecidos reglamentariamente.</p><p>Entre sus funciones se encuentra prestar asesoramiento en cuestiones relacionadas con la prevención de la tortura y otros malos tratos y con las visitas a lugares de privación de libertad.</p><h4>Principios de actuación del MNP</h4><p>La actuación preventiva debe basarse en:</p><ul class='clean'><li>Independencia.</li><li>Imparcialidad.</li><li>Objetividad.</li><li>Confidencialidad.</li><li>Prevención.</li><li>Protección de las personas privadas de libertad.</li></ul><h4>Relación con el Subcomité para la Prevención de la Tortura</h4><p>El MNP español forma parte del sistema preventivo establecido por el OPCAT. Existe una relación de cooperación con el <b>Subcomité para la Prevención de la Tortura de Naciones Unidas</b>, sin que el MNP español deje por ello de actuar como mecanismo nacional independiente.</p><h4>Informes y recomendaciones</h4><p>Después de sus actuaciones, el MNP puede formular:</p><ul class='clean'><li>Recomendaciones.</li><li>Sugerencias.</li><li>Propuestas de mejora.</li></ul><p>Su finalidad es prevenir situaciones que puedan favorecer la tortura o los malos tratos y mejorar las condiciones de las personas privadas de libertad. Los resultados de la actividad del MNP se reflejan en los informes correspondientes del Defensor del Pueblo.</p>",
    conceptos:[],
    normativa:[{norma:"Ley Orgánica 3/1981, de 6 de abril", detalle:"Del Defensor del Pueblo.", url:"https://www.boe.es/buscar/act.php?id=BOE-A-1981-10325"},{norma:"Reglamento de Organización y Funcionamiento del Defensor del Pueblo", detalle:"Incluye la regulación del Consejo Asesor del Mecanismo Nacional de Prevención de la Tortura.", url:"https://www.defensordelpueblo.es"}],
    datos:["Norma reguladora: LO 3/1981, de 6 de abril, y su Reglamento de Organización y Funcionamiento","Estructura: Defensor del Pueblo + Adjuntos + Secretaría General + órganos y servicios","El Defensor del Pueblo es el MNP en España, en cumplimiento del Protocolo Facultativo de la Convención contra la Tortura","El Consejo Asesor del MNP está presidido por el Adjunto con la coordinación del MNP atribuida","Principios de actuación del MNP: independencia, imparcialidad, objetividad, confidencialidad, prevención, protección"],
    advertencias:["No confundas al Defensor del Pueblo actuando como supervisor ordinario de la Administración con su función específica como MNP: son dos facetas distintas de la misma institución.","El Consejo Asesor del MNP lo preside un Adjunto del Defensor del Pueblo (el que tenga atribuida esa coordinación), no el propio Defensor del Pueblo en persona.","Las visitas del MNP son preventivas: no sustituyen a la investigación penal cuando ya hay indicios de delito de tortura.","El MNP español coopera con el Subcomité de la ONU, pero actúa siempre como mecanismo nacional independiente."],
    fuentes:[{texto:"BOE-A-1981-10325, Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo", url:"https://www.boe.es/buscar/act.php?id=BOE-A-1981-10325"},{texto:"Defensor del Pueblo — sitio oficial", url:"https://www.defensordelpueblo.es"}],

/* ============================= HELPERS MULTI-TEMA (oficial + borrador) ============================= */

function officialApartados(temaId){ return temaId===1 ? TEMA1_APARTADOS : []; }
function draftApartados(temaId){ return (STATE.borrador.apartados[temaId]) || []; }
function allApartados(temaId){ return officialApartados(temaId).concat(draftApartados(temaId)); }
function allApartadoIds(temaId){ return allApartados(temaId).map(a=>a.id); }
function allPreguntasApartado(apId){ return TEMA1_PREGUNTAS[apId] || []; }
function testFinalDisponible(temaId){ return !!(TEMA_EXAMEN_FINAL[temaId] && TEMA_EXAMEN_FINAL[temaId].length); }
function temaDisponible(temaId){
  if(temaId===1) return true;
  const apAnterior = allApartados(temaId-1);
  if(!apAnterior.length) return false;
  const completados = apartadosCompletadosTema(temaId-1);
  return apAnterior.every(a=>completados.includes(a.id));
}
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function textoAHtml(text){
  if(!text) return '<p style="color:var(--text-tert);">Sin contenido todavía.</p>';
  return text.split(/\n\s*\n/).map(p=>`<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('');
}

async function loadStorage(){
  try{
    const data = await sbSelectAll();
    (data||[]).forEach(row=>{
      if(row.key==='perfil') STATE.perfil = {...STATE.perfil, ...row.value};
      if(row.key==='progreso') STATE.progreso = row.value;
      if(row.key==='intentos') STATE.intentos = row.value;
      if(row.key==='errores') STATE.errores = row.value;
      if(row.key==='borrador') STATE.borrador = row.value;
    });
    ocultarBannerDB();
  }catch(e){ mostrarErrorDB(e); }
}
async function saveKey(key,val){
  try{
    await sbUpsert(key, val);
    ocultarBannerDB();
    return true;
  }catch(e){ mostrarErrorDB(e); return false; }
}

function mostrarErrorDB(error){
  console.warn('Error de Supabase:', error);
  const banner = document.getElementById('dbBanner');
  if(!banner) return;
  const msg = (error && (error.message||error.toString())) || 'Error desconocido';
  const code = error && error.code;
  let ayuda = '';
  if(code==='42P01' || /relation .* does not exist/i.test(msg)){
    ayuda = `La tabla <code>app_data</code> no existe todavía en tu proyecto de Supabase. Ve al <b>SQL Editor</b> de tu proyecto y ejecuta:
<pre>create table if not exists app_data (
  key text primary key,
  value jsonb not null,
  updated_at timestamptz not null default now()
);

alter table app_data enable row level security;

create policy "allow anon all access" on app_data
  for all to anon using (true) with check (true);</pre>`;
  } else if(code==='42501' || /row-level security|permission denied/i.test(msg)){
    ayuda = `La tabla existe pero la política de seguridad (RLS) no deja escribir/leer al rol <code>anon</code>. Ejecuta en el SQL Editor:
<pre>alter table app_data enable row level security;
create policy "allow anon all access" on app_data
  for all to anon using (true) with check (true);</pre>`;
  } else if(/Failed to fetch|NetworkError|fetch/i.test(msg)){
    ayuda = 'No se ha podido contactar con tu proyecto de Supabase (revisa tu conexión a internet o que la URL del proyecto siga siendo correcta).';
  } else {
    ayuda = 'Revisa la consola del navegador (F12) para más detalle del error.';
  }
  banner.innerHTML = `<div class="db-banner">
    ⚠ <b>No se está guardando en Supabase.</b> Error: <code>${msg}</code><br>
    ${ayuda}
    <br><button onclick="reintentarConexionDB()">Reintentar conexión</button>
  </div>`;
}
function ocultarBannerDB(){
  const banner = document.getElementById('dbBanner');
  if(banner) banner.innerHTML = '';
}
async function reintentarConexionDB(){
  await loadStorage();
  render();
}

function persistProgreso(){ saveKey('progreso', STATE.progreso); }
function persistIntentos(){ saveKey('intentos', STATE.intentos); }
function persistErrores(){ saveKey('errores', STATE.errores); }
function persistPerfil(){ saveKey('perfil', STATE.perfil); }
function persistBorrador(){ saveKey('borrador', STATE.borrador); }

function apartadosCompletadosTema(temaId){ return (STATE.progreso.apartadosCompletados[temaId])||[]; }
function marcarApartadoCompletado(temaId, apartadoId){
  const arr = apartadosCompletadosTema(temaId);
  if(!arr.includes(apartadoId)){ arr.push(apartadoId); STATE.progreso.apartadosCompletados[temaId]=arr; persistProgreso(); }
}
function progresoTemaPct(temaId){
  const total = allApartados(temaId).length || 1;
  const done = apartadosCompletadosTema(temaId).length;
  return Math.round((done/total)*100);
}
function toggleModoEdicion(){
  STATE.perfil.modoEdicion = !STATE.perfil.modoEdicion;
  persistPerfil();
  render();
}

function toggleModoAdmin(){
  STATE.perfil.modoAdmin = !STATE.perfil.modoAdmin;
  persistPerfil();
  render();
}

async function reiniciarProgreso(){
  const confirmacion = prompt('Esto borrará TODO tu progreso, intentos de test y errores acumulados (el contenido del temario NO se toca). Escribe REINICIAR para confirmar:');
  if(confirmacion !== 'REINICIAR') return;
  STATE.progreso = {apartadosCompletados:{}, ultimoVisitado:{temaId:1, apartadoId:'1-1'}};
  STATE.intentos = {apartado:{}, final:{}};
  STATE.errores = [];
  STATE.temarioExpandido = {};
  await Promise.all([
    saveKey('progreso', STATE.progreso),
    saveKey('intentos', STATE.intentos),
    saveKey('errores', STATE.errores)
  ]);
  STATE.view = 'home';
  render();
}

function saludo(){
  const h = new Date().getHours();
  if(h<12) return "Buenos días";
  if(h<20) return "Buenas tardes";
  return "Buenas noches";
}

function renderHome(){
  const pct1 = progresoTemaPct(1);
  const totalIntentosFinal = (STATE.intentos.final[1]||[]).length;
  const ultTemaId = STATE.progreso.ultimoVisitado.temaId || 1;
  const ultApartados = allApartados(ultTemaId);
  const ultimoApartado = ultApartados.find(a=>a.id===STATE.progreso.ultimoVisitado.apartadoId) || ultApartados[0] || TEMA1_APARTADOS[0];
  const erroresRecientes = STATE.errores.slice(-3).reverse();
  return `
  <div class="view">
    <div class="hero">
      <div class="ring-decor"></div><div class="ring-decor two"></div>
      <h2>${saludo()}, ${STATE.perfil.nombre} 👋</h2>
      <p>Continúa donde lo dejaste. Llevas ${apartadosCompletadosTema(1).length} de ${TEMA1_APARTADOS.length} apartados del Tema 1.</p>
      <div class="hero-btn" onclick="abrirApartado(${ultTemaId},'${ultimoApartado.id}')">Continuar estudiando ${ICONS.chev}</div>
    </div>
    <div class="grid-2" style="margin-bottom:20px;">
      <div class="card">
        <h3 class="card-title">Objetivo · Tema 1, Derechos Humanos</h3>
        <div class="tema-bar-track" style="width:100%;height:8px;margin-bottom:10px;"><div class="tema-bar-fill" style="width:${pct1}%"></div></div>

      </div>
      <div class="card">
        <h3 class="card-title">Para repasar</h3>
        ${erroresRecientes.length? erroresRecientes.map(e=>`<div class="mini-row"><span>${e.pregunta.slice(0,46)}${e.pregunta.length>46?'…':''}</span><span class="pill bad">Fallada</span></div>`).join('') : `<div style="font-size:13px;color:var(--text-tert);">Aún no tienes preguntas falladas. ¡Bien!</div>`}
      </div>
    </div>
    <div class="card">
      <h3 class="card-title">Últimos tests</h3>
      ${renderUltimosTests()}
    </div>
  </div>`;
}

function renderUltimosTests(){
  let filas = [];
  Object.keys(STATE.intentos.apartado).forEach(apId=>{
    STATE.intentos.apartado[apId].forEach(at=>filas.push({tipo:'Repaso · '+ (TEMA1_APARTADOS.find(a=>a.id===apId)||{}).titulo, ...at}));
  });
  (STATE.intentos.final[1]||[]).forEach(at=>filas.push({tipo:'Test final · Tema 1', ...at}));
  filas.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  filas = filas.slice(0,5);
  if(!filas.length) return `<div style="font-size:13px;color:var(--text-tert);">Todavía no has hecho ningún test.</div>`;
  return `<table class="history-table"><thead><tr><th>Test</th><th>Fecha</th><th>Resultado</th></tr></thead><tbody>
    ${filas.map(f=>`<tr><td>${f.tipo}</td><td>${f.fecha}</td><td><span class="pill ${f.pct>=70?'ok':f.pct>=50?'warn':'bad'}">${f.aciertos}/${f.total} · ${f.pct}%</span></td></tr>`).join('')}
  </tbody></table>`;
}

function renderTemario(){
  const editando = STATE.perfil.modoEdicion;
  const admin = STATE.perfil.modoAdmin;
  if(!STATE.temarioExpandido) STATE.temarioExpandido = {};
  return `
  <div class="view">
    <h1 class="page-title">Temario</h1>
    <p class="page-sub">25 temas oficiales verificados. ${admin? 'Modo admin activo: todos los temas están desbloqueados para pruebas.' : editando? 'Modo edición activo: puedes entrar en cualquier tema para escribir contenido, aunque no hayas terminado los anteriores.' : 'El Tema 1 está disponible para estudiar; el resto se irá desbloqueando. Despliega un tema para ver sus apartados.'}</p>
    <div class="tema-list">
      ${TEMAS.map(t=>{
        const disponible = temaDisponible(t.id);
        const clickable = disponible || editando || admin;
        const pct = disponible ? progresoTemaPct(t.id) : 0;
        const totalAp = allApartados(t.id).length;
        let meta;
        if(disponible){ meta = apartadosCompletadosTema(t.id).length+' / '+totalAp+' apartados'; }
        else if(admin){ meta = totalAp? totalAp+' apartado(s) · desbloqueado (admin)' : 'Sin contenido · desbloqueado (admin)'; }
        else if(editando){ meta = totalAp? totalAp+' apartado(s) en borrador · click para editar' : 'Sin contenido — click para escribir'; }
        else { meta = 'Próximamente'; }
        const expandible = (disponible || admin) && totalAp>0;
        const expandido = !!STATE.temarioExpandido[t.id];
        return `<div class="tema-row-wrap">
          <div class="tema-row ${clickable?'enabled':''}">
            <div class="tema-num ${clickable?'enabled':'locked'}" ${clickable?`onclick="abrirTemaLibre(${t.id})"`:''}>${t.id}</div>
            <div class="tema-body" ${clickable?`onclick="abrirTemaLibre(${t.id})"`:''}>
              <div class="tema-title ${clickable?'':'locked'}">${t.titulo}</div>
              <div class="tema-meta">${meta}</div>
            </div>
            ${disponible? `<div class="tema-bar-track"><div class="tema-bar-fill" style="width:${pct}%"></div></div>` : ''}
            ${expandible? `<div class="expand-toggle ${expandido?'open':''}" onclick="toggleTemaExpandido(${t.id})">${ICONS.chev}</div>` : (clickable? `<div style="width:22px;"></div>` : `<div class="lock-icon">${ICONS.lock}</div>`)}
          </div>
          ${expandido? renderSubapartados(t) : ''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderSubapartados(t){
  const apartados = allApartados(t.id);
  const completados = apartadosCompletadosTema(t.id);
  const admin = STATE.perfil.modoAdmin;
  const todosCompletos = admin || (apartados.length>0 && completados.length===apartados.length);
  let rows = apartados.map((a,i)=>{
    const unlocked = admin || i===0 || completados.includes(apartados[i-1].id);
    const done = completados.includes(a.id);
    const numPreguntas = allPreguntasApartado(a.id).length;
    return `<div class="subap-row ${unlocked?'':'locked'}">
      <div class="subap-main" ${unlocked?`onclick="abrirApartado(${t.id},'${a.id}')"`:''}>
        <div class="subap-dot ${done?'done':''}"></div>
        <div class="subap-label">${i+1}. ${a.titulo}</div>
      </div>
      ${unlocked? (numPreguntas? `<div class="subap-icon" title="Repetir test" onclick="event.stopPropagation();repetirTestApartado(${t.id},'${a.id}')">${ICONS.test}</div>` : '<span></span>') : `<div class="subap-icon">${ICONS.lock}</div>`}
    </div>`;
  }).join('');
  rows += `<div class="subap-row ${todosCompletos?'':'locked'}">
    <div class="subap-main" ${todosCompletos?`onclick="irARepaso(${t.id})"`:''}>
      <div class="subap-dot ${todosCompletos?'done':''}"></div>
      <div class="subap-label">Repaso · resumen y examen final</div>
    </div>
    ${todosCompletos? `<div class="subap-icon" title="Examen final" onclick="event.stopPropagation();repetirExamenFinal(${t.id})">${ICONS.test}</div>` : `<div class="subap-icon">${ICONS.lock}</div>`}
  </div>`;
  return `<div class="subap-list">${rows}</div>`;
}

  if(!STATE.temarioExpandido) STATE.temarioExpandido = {};
  STATE.temarioExpandido[id] = !STATE.temarioExpandido[id];
  render();
}

  STATE.focusQuiz = null;
  iniciarQuiz('apartado', apId);
}
function repetirExamenFinal(temaId){
  STATE.temaActivo = temaId;
  STATE.focusQuiz = null;
  iniciarQuiz('final', temaId);
}
function irARepaso(temaId){
  STATE.temaActivo = temaId;
  STATE.view = 'repaso';
  render();
}

function abrirTestDesdeIndice(temaId, apId){
  STATE.temaActivo = temaId;
  STATE.focusQuiz = {temaId, apId, volverA: STATE.apartadoActivo};
  iniciarQuiz('apartado', apId);
}

function salirDeFocusQuiz(){
  const fq = STATE.focusQuiz;
  STATE.focusQuiz = null;
  if(fq){ abrirApartado(fq.temaId, fq.volverA); }
  else { go('temario'); }
}

function inicializarFocusScroll(){
  const wrap = document.getElementById('focusScroll');
  if(!wrap) return;
  wrap.addEventListener('scroll', actualizarProgresoScroll);
  actualizarProgresoScroll();
}

function actualizarProgresoScroll(){
  const wrap = document.getElementById('focusScroll');
  const ring = document.getElementById('ringFg');
  if(!wrap) return;
  const scrollable = wrap.scrollHeight - wrap.clientHeight;
  const progress = scrollable > 4 ? Math.min(1, wrap.scrollTop/scrollable) : 1;
  if(ring){
    const circumference = 94.2477;
    ring.setAttribute('stroke-dashoffset', (circumference*(1-progress)).toFixed(2));
  }
  if(progress > 0.96){
    const temaId = STATE.temaActivo;
    const apId = STATE.apartadoActivo;
    const completados = apartadosCompletadosTema(temaId);
    if(!completados.includes(apId)){
      marcarApartadoCompletado(temaId, apId);
      const iconEl = document.getElementById('idxicon-c-'+apId);
      if(iconEl){ iconEl.classList.add('done'); iconEl.innerHTML = ICONS.check; }
      const track = document.querySelector('.focus-progress-fill');
      const label = document.querySelector('.focus-progress-label');
      if(track && label){
        const total = allApartados(temaId).length || 1;
        const done = apartadosCompletadosTema(temaId).length;
        const pct = Math.round((done/total)*100);
        track.style.width = pct+'%';
        label.textContent = pct+'% completado';
      }
    }
  }
}

function abrirTemaLibre(id){
  const t = TEMAS.find(x=>x.id===id);
  STATE.temaActivo = id;
  if(t && (temaDisponible(id) || STATE.perfil.modoAdmin)){
    const aps = allApartados(id);
    STATE.apartadoActivo = (aps[0]||{}).id || null;
    STATE.view='tema';
  } else if(STATE.perfil.modoEdicion){
    STATE.view='editor';
  } else {
    return;
  }
  render();
}

function previsualizarTema(temaId){
  const aps = allApartados(temaId);
  if(!aps.length) return;
  STATE.temaActivo = temaId;
  STATE.apartadoActivo = aps[0].id;
  STATE.view = 'tema';
  render();
}

function renderTemaStudy(){
  const temaId = STATE.temaActivo;
  const tema = TEMAS.find(t=>t.id===temaId) || TEMAS[0];
  const apartados = allApartados(temaId);
  const apIds = apartados.map(a=>a.id);
  let apId = STATE.apartadoActivo;
  if(!apIds.includes(apId)) apId = apIds[0];
  const apartado = apartados.find(a=>a.id===apId);
  const completados = apartadosCompletadosTema(temaId);
  const doneCount = apIds.filter(id=>completados.includes(id)).length;
  const pct = apartados.length? Math.round((doneCount/apartados.length)*100) : 0;

  const backBtn = `<div class="focus-back-btn" onclick="go('temario')">${ICONS.arrowLeft}<span>Temario</span></div>`;

  const ringSvg = `<svg viewBox="0 0 36 36" width="24" height="24" style="position:absolute;top:0;left:0;"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="3"/><circle cx="18" cy="18" r="15" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="94.2477" stroke-dashoffset="94.2477" stroke-linecap="round" transform="rotate(-90 18 18)" id="ringFg"/></svg>`;

  const secuencia = [];
  apartados.forEach((a,i)=>{
    secuencia.push({tipo:'contenido', apId:a.id, numero:i+1, titulo:a.titulo});
    secuencia.push({tipo:'test', apId:a.id, numero:i+1, titulo:'Autoevaluación '+(i+1)});
  });

  const sidebarHtml = `
    <div class="focus-sidebar">
      <h1 class="focus-tema-title">Tema ${temaId}. ${tema.titulo}</h1>
      <div class="focus-progress-track"><div class="focus-progress-fill" style="width:${pct}%"></div></div>
      <div class="focus-progress-label">${pct}% completado</div>
      <div class="focus-index">
        ${secuencia.map(item=>{
          if(item.tipo==='contenido'){
            const done = completados.includes(item.apId);
            const active = item.apId===apId;
            let iconInner;
            if(done) iconInner = ICONS.check;
            else if(active) iconInner = ringSvg + `<span style="position:relative;z-index:1;">${item.numero}</span>`;
            else iconInner = item.numero;
            return `<div class="focus-index-item ${active?'active':''}" onclick="abrirApartado(${temaId},'${item.apId}')">
              <div class="focus-index-icon ${done?'done':''}" id="idxicon-c-${item.apId}">${iconInner}</div>
              <div class="focus-index-label">${item.titulo}</div>
            </div>`;
          } else {
            const intentos = (STATE.intentos.apartado[item.apId]||[]).length;
            return `<div class="focus-index-item test-item" onclick="abrirTestDesdeIndice(${temaId},'${item.apId}')">
              <div class="focus-index-icon test-icon">${intentos? ICONS.check : ICONS.test}</div>
              <div class="focus-index-label test-label">${item.titulo}</div>
            </div>`;
          }
        }).join('')}
      </div>
    </div>`;

  if(!apartado){
    return `<div class="focus-layout">
      ${sidebarHtml}
      <div class="focus-content-wrap">
        ${backBtn}
        <div class="focus-content">
          <div class="card"><div class="empty-state">${ICONS.empty}<p>Todavía no hay contenido para este tema.</p>
            ${STATE.perfil.modoEdicion? `<button class="btn btn-primary" style="margin-top:14px;" onclick="STATE.view='editor';render();">Escribir contenido →</button>`:''}
          </div></div>
        </div>
      </div>
    </div>`;
  }

  const idx = apIds.indexOf(apId);

  const normativaHtml = (apartado.normativa||[]).map(n=>{
    if(n.url) return `<a class="fuente-link" href="${n.url}" target="_blank" rel="noopener noreferrer"><span><b>${n.norma}</b><br>${n.detalle}</span>${ICONS.chev}</a>`;
    return `<div class="norm-item"><b>${n.norma}</b><br>${n.detalle}</div>`;
  }).join('');
  const datosHtml = (apartado.datos||[]).map(d=>`<span class="data-chip">${d}</span>`).join('');
  const fuentesHtml = (apartado.fuentes||[]).map(f=>{
    if(typeof f==='object' && f.url) return `<a class="fuente-link" href="${f.url}" target="_blank" rel="noopener noreferrer"><span>${f.texto}</span>${ICONS.chev}</a>`;
    return `<div class="norm-item">${f}</div>`;
  }).join('');
  const conceptosArr = apartado.conceptos||[];

  const estudioHtml = apartado.estudio
    ? (apartado.introEstudio||'') + apartado.estudio.map(s=>`<h4 style="font-size:15.5px;font-weight:700;margin:22px 0 8px 0;">${s.titulo}</h4>${s.html}`).join('')
    : (apartado.contenidoEstudio || apartado.explicacion || '<p style="color:var(--text-tert);">Sin contenido todavía.</p>');

  const preguntasAp = allPreguntasApartado(apId);

  const prevId = idx>0? apIds[idx-1] : null;
  const nextId = idx<apIds.length-1? apIds[idx+1] : null;

  const contentHtml = `
    <div class="focus-content">
      <div class="apartado-eyebrow">Tema ${temaId} · Apartado ${idx+1} de ${apartados.length}</div>
      <h1 class="focus-apartado-title">${apartado.titulo}</h1>

      <div class="section-block" id="sec-${apId}-contenido">
        <div class="section-body rich-content">${estudioHtml}</div>
      </div>

      ${conceptosArr.length? `<div class="section-block" id="sec-${apId}-conceptos">
        <div class="section-head">${ICONS.key} Conceptos fundamentales</div>
        <ul class="clean">${conceptosArr.map(c=>`<li>${c}</li>`).join('')}</ul>
      </div>` : ''}

      ${normativaHtml? `<div class="section-block" id="sec-${apId}-normativa">
        <div class="section-head">${ICONS.scale} Normativa</div>
        ${normativaHtml}
      </div>`:''}

      ${datosHtml? `<div class="section-block" id="sec-${apId}-datos">
        <div class="section-head">${ICONS.chart} Datos que debes memorizar</div>
        <div>${datosHtml}</div>

/* ============================= QUIZ ENGINE ============================= */

function construirPreguntasApartado(apId){
  let qs = (TEMA1_PREGUNTAS[apId]||[]).map(p=>({...p, apartado: (TEMA1_APARTADOS.find(a=>a.id===apId)||{}).titulo}));
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
  return qs.slice(0, Math.min(5, qs.length));
}
function construirPreguntasFinal(temaId){
  const banco = TEMA_EXAMEN_FINAL[temaId];
  if(banco && banco.length){
    let qs = banco.map(p=>({...p, apartado:'Examen final'}));
    for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
    return qs.slice(0, Math.min(15, qs.length));
  }
  let pool = [];
  allApartadoIds(temaId).forEach(apId=>{
    const qs = (TEMA1_PREGUNTAS[apId]||[]).map(p=>({...p, apartado:(TEMA1_APARTADOS.find(a=>a.id===apId)||{}).titulo}));
    for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
    pool = pool.concat(qs.slice(0,3));
  });
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool;
}

function iniciarQuiz(tipo, refId){
  let preguntas = tipo==='apartado'? construirPreguntasApartado(refId) : construirPreguntasFinal(refId);
  STATE.quiz = {tipo, refId, preguntas, actual:0, respuestas:[], seleccion:null, mostrarFeedback:false};
  STATE.view='quiz';
  render();
}

function renderQuiz(){
  const qz = STATE.quiz;
  const p = qz.preguntas[qz.actual];
  const total = qz.preguntas.length;
  return `<div class="view">
    <div class="quiz-wrap">
      <div class="quiz-progress">
        ${qz.preguntas.map((pp,i)=>{
          let cls='quiz-progress-seg';
          if(i<qz.respuestas.length){ cls += qz.respuestas[i].correcta? ' correct':' wrong'; }
          else if(i===qz.actual){ cls += ' filled'; }
          return `<div class="${cls}"></div>`;
        }).join('')}
      </div>
      <div class="q-counter">PREGUNTA ${qz.actual+1} DE ${total}</div>
      <div class="q-text">${p.q}</div>
      <div>
        ${p.o.map((op,i)=>{
          let cls='option';
          if(qz.mostrarFeedback){
            if(i===p.c) cls+=' correct';
            else if(i===qz.seleccion) cls+=' incorrect';
          } else if(qz.seleccion===i){ cls+=' selected'; }
          return `<div class="${cls}" onclick="${qz.mostrarFeedback?'':`seleccionarOpcion(${i})`}">
            <div class="option-letter">${String.fromCharCode(65+i)}</div><div>${op}</div>
          </div>`;
        }).join('')}
      </div>
      ${qz.mostrarFeedback? `
        <div class="feedback-box ${qz.seleccion===p.c?'ok':'bad'}">
          ${qz.seleccion===p.c? '<b>Correcto.</b> ':'<b>Incorrecto.</b> '} ${p.e}
          <div class="feedback-ref">Referencia: ${p.ref}</div>
        </div>
        <div class="apartado-nav" style="border-top:none;padding-top:22px;justify-content:flex-end;">
          <button class="btn btn-primary" onclick="siguientePregunta()">${qz.actual<total-1? 'Siguiente pregunta →':'Ver resultado'}</button>
        </div>` : `
        <div class="apartado-nav" style="border-top:none;padding-top:22px;justify-content:flex-end;">
          <button class="btn btn-primary" onclick="responder()" ${qz.seleccion===null?'disabled':''}>Responder</button>
        </div>`}
    </div>
  </div>`;
}

function seleccionarOpcion(i){ STATE.quiz.seleccion = i; render(); }

function responder(){
  const qz = STATE.quiz;
  if(qz.seleccion===null || qz.seleccion===undefined) return;
  const p = qz.preguntas[qz.actual];
  const correcta = qz.seleccion===p.c;
  qz.respuestas.push({correcta, seleccion:qz.seleccion});
  qz.mostrarFeedback = true;
  if(!correcta){
    const yaExiste = STATE.errores.find(e=>e.pregunta===p.q);
    if(!yaExiste){
      STATE.errores.push({pregunta:p.q, correcta:p.o[p.c], explicacion:p.e, apartado:p.apartado, fecha:new Date().toLocaleDateString('es-ES')});
      persistErrores();
    }
  }
  render();
}

function siguientePregunta(){
  const qz = STATE.quiz;
  if(qz.actual < qz.preguntas.length-1){
    qz.actual++; qz.seleccion=null; qz.mostrarFeedback=false;
    render();
  } else {
    finalizarQuiz();
  }
}

function finalizarQuiz(){
  const qz = STATE.quiz;
  const aciertos = qz.respuestas.filter(r=>r.correcta).length;
  const total = qz.preguntas.length;
  const pct = Math.round((aciertos/total)*100);
  const intento = {fecha:new Date().toLocaleDateString('es-ES')+' '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}), aciertos, total, pct};

  if(qz.tipo==='apartado'){
    if(!STATE.intentos.apartado[qz.refId]) STATE.intentos.apartado[qz.refId]=[];
    STATE.intentos.apartado[qz.refId].push(intento);
  } else {
    if(!STATE.intentos.final[qz.refId]) STATE.intentos.final[qz.refId]=[];
    STATE.intentos.final[qz.refId].push(intento);
  }
  persistIntentos();
  STATE.view='resultado';
  STATE.ultimoResultado = intento;
  STATE.quizTipoResultado = qz.tipo;
  STATE.quizRefResultado = qz.refId;
  render();
}

  const r = STATE.ultimoResultado;
  const cls = r.pct>=70?'good':r.pct>=50?'mid':'bad';
  const msg = r.pct>=90? 'Excelente dominio del apartado.' : r.pct>=70? 'Buen resultado, sigue así.' : r.pct>=50? 'Vas bien, repasa los fallos antes de repetir.' : 'Conviene repasar el contenido antes de repetir el test.';
  return `<div class="view">
    <div class="quiz-wrap">
      <div class="card">
        <div class="result-hero">
          <div class="result-score ${cls}">${r.pct}%</div>
          <div class="result-label">${r.aciertos} de ${r.total} respuestas correctas</div>
          <p style="font-size:14px;color:var(--text-sec);margin-top:14px;">${msg}</p>

}

function cmd(editorId, command, value){
  const el = document.getElementById(editorId);
  el.focus();
  document.execCommand(command, false, value || null);
  guardarRichContentById(editorId);
}
function aplicarEstilo(editorId, tag){
  if(!tag) return;
  const el = document.getElementById(editorId);
  el.focus();
  document.execCommand('formatBlock', false, tag);
  guardarRichContentById(editorId);
}
function aplicarTamano(editorId, size){
  if(!size) return;
  const el = document.getElementById(editorId);
  el.focus();
  document.execCommand('fontSize', false, size);
  guardarRichContentById(editorId);
}
function guardarRichContentById(editorId){
  const info = EDITOR_MAP[editorId];
  if(!info) return;
  const el = document.getElementById(editorId);
  if(!el) return;
  const arr = STATE.borrador.apartados[info.temaId]||[];
  const ap = arr.find(a=>a.id===info.apId);
  if(ap){ ap.contenidoEstudio = el.innerHTML; persistBorrador(); }
}

function anadirApartadoBorrador(temaId){
  if(!STATE.borrador.apartados[temaId]) STATE.borrador.apartados[temaId]=[];
  const n = STATE.borrador.apartados[temaId].length + officialApartados(temaId).length + 1;
  const nuevoId = 'b'+temaId+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  STATE.borrador.apartados[temaId].push({id:nuevoId, titulo:'Apartado '+n, contenidoEstudio:'', esBorrador:true});
  persistBorrador();
  render();
}
function actualizarBorrador(temaId, apId, campo, valor){
  const arr = STATE.borrador.apartados[temaId]||[];
  const ap = arr.find(a=>a.id===apId);
  if(ap){ ap[campo]=valor; persistBorrador(); }
}
function borrarApartadoBorrador(temaId, apId){
  if(!confirm('¿Eliminar este apartado del borrador? No se puede deshacer.')) return;
  STATE.borrador.apartados[temaId] = (STATE.borrador.apartados[temaId]||[]).filter(a=>a.id!==apId);
  persistBorrador();
  render();
}

function exportarBorradorTema(temaId){
  const drafts = draftApartados(temaId);
  const tema = TEMAS.find(t=>t.id===temaId) || {};
  const json = JSON.stringify({tema: temaId, titulo: tema.titulo, apartados: drafts}, null, 2);
  const box = document.getElementById('exportBox');
  if(box){
    box.style.display = 'block';
    box.value = json;
    box.focus();
    box.select();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(()=>{
      alert('Contenido copiado al portapapeles. Pégalo en el chat con Claude para que complete normativa, datos, trampas, fuentes y test.');
    }).catch(()=>{
      alert('No se pudo copiar automáticamente. El contenido está seleccionado abajo: cópialo con Ctrl+C / Cmd+C.');
    });
  } else {
    alert('El contenido está seleccionado abajo: cópialo con Ctrl+C / Cmd+C.');
  }
}

/* ============================= ROUTING ============================= */

function go(view){ STATE.view=view; render(); }
function abrirTema(id){ abrirTemaLibre(id); }
function abrirApartado(temaId,apId){
  STATE.view='tema'; STATE.temaActivo=temaId; STATE.apartadoActivo=apId;
  STATE.progreso.ultimoVisitado={temaId,apartadoId:apId}; persistProgreso();
  render(); window.scrollTo(0,0);
}
function guardarNombre(){
  const v = document.getElementById('nombreInput').value.trim();
  if(v){ STATE.perfil.nombre=v; persistPerfil(); render(); }
}

function render(){
  if(STATE.view==='tema'){
    document.getElementById('app').innerHTML = renderTemaStudy();
    inicializarFocusScroll();
    return;
  }
  if((STATE.view==='quiz' || STATE.view==='resultado') && STATE.focusQuiz){
    const inner = STATE.view==='quiz'? renderQuiz() : renderResultado();
    document.getElementById('app').innerHTML = `<div class="focus-layout">
      <div class="focus-content-wrap">
        <div class="focus-back-btn" onclick="salirDeFocusQuiz()">${ICONS.arrowLeft}<span>Volver al apartado</span></div>
        <div class="focus-content">${inner}</div>
      </div>
    </div>`;
    return;
  }
  let body='';
  if(STATE.view==='home') body=renderHome();
  else if(STATE.view==='temario') body=renderTemario();
  else if(STATE.view==='repaso') body=renderRepaso(STATE.temaActivo);
  else if(STATE.view==='tests') body=renderTests();
  else if(STATE.view==='errores') body=renderErrores();
  else if(STATE.view==='progreso') body=renderProgreso();
  else if(STATE.view==='config') body=renderConfig();
  else if(STATE.view==='quiz') body=renderQuiz();
  else if(STATE.view==='resultado') body=renderResultado();
  else if(STATE.view==='editor') body=renderEditor();
  document.getElementById('app').innerHTML = renderSidebar() + `<div class="main">${body}</div>`;
}

function irASeccion(apId, key){
  const el = document.getElementById('sec-'+apId+'-'+key);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}


(async function init(){
  document.getElementById('app').innerHTML = `<div style="padding:60px;color:#6e6e73;font-size:14px;">Cargando…</div>`;
  await loadStorage();
  render();
})();
</script>
</body>
