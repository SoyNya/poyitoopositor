<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia GC · Escala de Cabos y Guardias</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --card-2:#fbfbfd;
    --text:#1d1d1f;
    --text-sec:#6e6e73;
    --text-tert:#86868b;
    --accent:#0071e3;
    --accent-hover:#0077ed;
    --accent-soft:#e8f1fd;
    --success:#1e8e3e;
    --success-soft:#e6f6ea;
    --error:#d93025;
    --error-soft:#fdeceb;
    --border:#d2d2d7;
    --border-soft:#e8e8ed;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.06);
    --shadow-md:0 4px 20px rgba(0,0,0,.08);
    --shadow-lg:0 12px 40px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent-soft);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:250px;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;
    background:rgba(255,255,255,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;padding:28px 16px;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 28px 10px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,#0071e3,#00c6fb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;}
  .brand-text{font-size:15px;font-weight:600;letter-spacing:-0.01em;}
  .brand-sub{font-size:11px;color:var(--text-tert);margin-top:1px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
    font-size:14px;color:var(--text-sec);font-weight:500;transition:background .15s,color .15s;
  }
  .nav-item svg{width:19px;height:19px;flex-shrink:0;}
  .nav-item:hover{background:rgba(0,0,0,.035);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);}
  .sidebar-foot{margin-top:auto;padding:12px 12px 0 12px;font-size:11px;color:var(--text-tert);border-top:1px solid var(--border-soft);padding-top:16px;}

  /* Main */
  .main{margin-left:250px;flex:1;min-width:0;padding:32px 40px 90px 40px;max-width:1520px;}
  .view{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  h1.page-title{font-size:30px;font-weight:700;letter-spacing:-0.02em;margin:0 0 6px 0;}
  p.page-sub{font-size:15px;color:var(--text-sec);margin:0 0 30px 0;}

  .card{background:var(--card);border-radius:var(--radius-lg);padding:24px 26px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  /* Home */
  .hero{
    background:linear-gradient(135deg,#0a2540,#0071e3 65%,#3fa9f5);
    border-radius:var(--radius-lg);padding:32px 34px;color:#fff;position:relative;overflow:hidden;margin-bottom:22px;
  }
  .hero h2{font-size:24px;font-weight:700;margin:0 0 6px 0;letter-spacing:-0.01em;}
  .hero p{font-size:14px;opacity:.85;margin:0 0 20px 0;max-width:440px;}
  .hero-btn{background:#fff;color:#0071e3;padding:11px 20px;border-radius:980px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .15s;}
  .hero-btn:hover{transform:scale(1.03);}
  .ring-decor{position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.25);}
  .ring-decor.two{right:10px;top:30px;width:140px;height:140px;}

  .stat-card{display:flex;flex-direction:column;gap:6px;}
  .stat-label{font-size:12px;color:var(--text-sec);font-weight:600;text-transform:none;}
  .stat-value{font-size:26px;font-weight:700;letter-spacing:-0.02em;}
  .stat-foot{font-size:12px;color:var(--text-tert);}

  .progress-ring-wrap{display:flex;align-items:center;gap:18px;}
  .mini-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
  .mini-row:last-child{border-bottom:none;}
  .pill{padding:3px 10px;border-radius:980px;font-size:11.5px;font-weight:600;}
  .pill.ok{background:var(--success-soft);color:var(--success);}
  .pill.warn{background:#fff4e0;color:#a05a00;}
  .pill.bad{background:var(--error-soft);color:var(--error);}
  .pill.neutral{background:var(--border-soft);color:var(--text-sec);}

  h3.card-title{font-size:15px;font-weight:600;margin:0 0 14px 0;}

  /* Temario list */
  .tema-list{display:flex;flex-direction:column;gap:10px;}
  .tema-row{
    display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);
    border:1px solid var(--border-soft);border-radius:var(--radius-md);transition:box-shadow .15s,border-color .15s;
  }
  .tema-row.enabled{cursor:pointer;}
  .tema-row.enabled:hover{box-shadow:var(--shadow-md);border-color:transparent;}
  .tema-num{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .tema-num.enabled{background:var(--accent-soft);color:var(--accent);}
  .tema-num.locked{background:var(--border-soft);color:var(--text-tert);}
  .tema-body{flex:1;min-width:0;}
  .tema-title{font-size:14.5px;font-weight:600;}
  .tema-title.locked{color:var(--text-tert);}
  .tema-meta{font-size:12px;color:var(--text-tert);margin-top:2px;}
  .tema-bar-track{width:90px;height:5px;background:var(--border-soft);border-radius:99px;overflow:hidden;flex-shrink:0;}
  .tema-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;}
  .chev{width:16px;height:16px;color:var(--text-tert);flex-shrink:0;}
  .lock-icon{width:15px;height:15px;color:var(--text-tert);}

  /* Tema study layout */
  .study-layout{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start;}
  @media(max-width:900px){.study-layout{grid-template-columns:1fr;}}
  .study-index{position:sticky;top:32px;}
  .mini-index-card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:18px 16px;}
  .mini-index-title{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border-soft);}
  .mini-index-items{display:flex;flex-direction:column;gap:1px;}
  .index-subitem{font-size:12.5px;color:var(--text-tert);padding:7px 0 7px 13px;border-left:2px solid var(--border-soft);cursor:pointer;transition:color .15s,border-color .15s;}
  .index-subitem:hover{color:var(--accent);border-left-color:var(--accent);}

  /* Modo focus (estudio de un tema, pantalla completa) */
  .focus-layout{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;z-index:200;background:var(--bg);}
  .focus-sidebar{width:320px;flex-shrink:0;background:linear-gradient(165deg,#0a2540 0%,#0071e3 68%,#2f9bf0 100%);color:#fff;padding:40px 28px;overflow-y:auto;display:flex;flex-direction:column;}
  .focus-tema-title{font-size:25px;font-weight:800;line-height:1.28;letter-spacing:-0.01em;margin:0 0 24px 0;}
  .focus-progress-track{width:100%;height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-bottom:8px;}
  .focus-progress-fill{height:100%;background:#fff;border-radius:99px;transition:width .3s ease;}
  .focus-progress-label{font-size:11.5px;color:rgba(255,255,255,.75);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:30px;}
  .focus-index{display:flex;flex-direction:column;gap:2px;flex:1;}
  .focus-index-item{display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:10px;cursor:pointer;transition:background .15s;}
  .focus-index-item:hover{background:rgba(255,255,255,.08);}
  .focus-index-item.active{background:rgba(255,255,255,.18);}
  .focus-index-icon{position:relative;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);}
  .focus-index-icon.done{background:#fff;border-color:#fff;color:#0071e3;}
  .focus-index-label{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.88);line-height:1.35;}
  .focus-index-item.active .focus-index-label{color:#fff;}
  .focus-index-item.test-item{padding-left:10px;margin-left:6px;}
  .focus-index-item.test-item:hover{background:rgba(255,255,255,.06);}
  .focus-index-icon.test-icon{border-style:dashed;border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.7);}
  .focus-index-icon.test-icon svg{width:11px;height:11px;}
  .focus-index-label.test-label{font-weight:500;font-size:12.5px;color:rgba(255,255,255,.68);font-style:italic;}

  .focus-content-wrap{flex:1;overflow-y:auto;position:relative;background:var(--bg);}
  .focus-back-btn{position:sticky;top:24px;left:32px;display:inline-flex;align-items:center;gap:8px;margin:24px 0 0 32px;padding:9px 18px 9px 12px;background:var(--card);border:1px solid var(--border-soft);border-radius:980px;font-size:13px;font-weight:700;color:var(--text-sec);cursor:pointer;box-shadow:var(--shadow-md);z-index:5;transition:color .15s,border-color .15s;}
  .focus-back-btn:hover{color:var(--accent);border-color:var(--accent);}
  .focus-content{max-width:760px;margin:0 auto;padding:8px 40px 110px 40px;}
  .focus-apartado-title{font-size:36px;font-weight:800;letter-spacing:-0.02em;line-height:1.16;margin:14px 0 30px 0;color:var(--text);}
  @media(max-width:900px){
    .focus-layout{flex-direction:column;position:fixed;overflow-y:auto;}
    .focus-sidebar{width:100%;padding:24px;}
    .focus-content{padding:20px 20px 90px 20px;}
    .focus-apartado-title{font-size:27px;}
  }

  /* Desplegable de apartados en la página Temario */
  .tema-row-wrap{display:flex;flex-direction:column;}
  .expand-toggle{cursor:pointer;color:var(--text-tert);display:flex;align-items:center;justify-content:center;padding:4px;border-radius:6px;transition:transform .2s,color .15s,background .15s;flex-shrink:0;}
  .expand-toggle:hover{background:var(--border-soft);color:var(--text);}
  .expand-toggle.open{transform:rotate(90deg);color:var(--accent);}
  .subap-list{margin:2px 0 8px 19px;padding:4px 0 4px 18px;border-left:2px solid var(--border-soft);display:flex;flex-direction:column;gap:1px;}
  .subap-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;}
  .subap-row:not(.locked):hover{background:rgba(0,0,0,.035);}
  .subap-main{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-size:13px;color:var(--text);min-width:0;}
  .subap-row.locked .subap-main{cursor:default;color:var(--text-tert);}
  .subap-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;}
  .subap-dot.done{background:var(--success);}
  .subap-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-tert);border-radius:6px;cursor:pointer;flex-shrink:0;}
  .subap-icon:hover{background:var(--accent-soft);color:var(--accent);}
  .subap-row.locked .subap-icon{cursor:default;color:var(--text-tert);}
  .subap-row.locked .subap-icon:hover{background:none;}

  .apartado-card{background:var(--card);border-radius:var(--radius-lg);padding:32px 36px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);}
  .apartado-eyebrow{font-size:12.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .apartado-title{font-size:23px;font-weight:700;letter-spacing:-0.01em;margin:0 0 18px 0;}
  .section-block{margin-bottom:26px;}
  .section-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-sec);margin-bottom:10px;}
  .section-head svg{width:16px;height:16px;}
  .section-body{font-size:14.5px;line-height:1.65;color:var(--text);}
  .section-body p{margin:0 0 10px 0;}
  ul.clean{margin:0;padding-left:19px;}
  ul.clean li{margin-bottom:7px;font-size:14.5px;line-height:1.55;}
  .norm-item{padding:12px 14px;background:var(--card-2);border-radius:var(--radius-sm);border:1px solid var(--border-soft);margin-bottom:8px;font-size:13.5px;}
  .norm-item b{font-weight:600;}
  a.fuente-link{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--card-2);border-radius:var(--radius-sm);border:1px solid var(--border-soft);margin-bottom:8px;font-size:13.5px;color:var(--text);text-decoration:none;cursor:pointer;transition:border-color .15s,background .15s,color .15s;line-height:1.5;}
  a.fuente-link svg{margin-top:3px;}
  a.fuente-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  a.fuente-link svg{width:14px;height:14px;flex-shrink:0;color:var(--text-tert);transition:color .15s;}
  a.fuente-link:hover svg{color:var(--accent);}
  .warn-box{background:#fff8e6;border:1px solid #f3e0a8;border-radius:var(--radius-sm);padding:14px 16px;font-size:13.5px;color:#7a5b00;line-height:1.55;}
  .data-chip{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin:0 8px 8px 0;}

  .apartado-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--border-soft);}
  .btn{padding:11px 20px;border-radius:980px;font-size:14px;font-weight:600;transition:transform .12s,background .15s;display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-primary:active{transform:scale(.97);}
  .btn-secondary{background:var(--border-soft);color:var(--text);}
  .btn-secondary:hover{background:#dcdce1;}
  .btn-ghost{color:var(--accent);font-weight:600;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* Quiz */
  .quiz-wrap{max-width:680px;margin:0 auto;}
  .quiz-progress{display:flex;gap:5px;margin-bottom:26px;}
  .quiz-progress-seg{flex:1;height:5px;border-radius:99px;background:var(--border-soft);overflow:hidden;}
  .quiz-progress-seg.filled{background:var(--accent);}
  .quiz-progress-seg.correct{background:var(--success);}
  .quiz-progress-seg.wrong{background:var(--error);}
  .q-counter{font-size:12.5px;color:var(--text-tert);font-weight:600;margin-bottom:10px;}
  .q-text{font-size:20px;font-weight:600;line-height:1.4;margin:0 0 26px 0;letter-spacing:-0.005em;}
  .option{
    display:flex;align-items:center;gap:14px;padding:15px 18px;border:1.5px solid var(--border);border-radius:var(--radius-md);
    margin-bottom:10px;font-size:14.5px;transition:border-color .15s,background .15s;cursor:pointer;
  }
  .option:hover{border-color:var(--accent);background:var(--accent-soft);}
  .option.selected{border-color:var(--accent);background:var(--accent-soft);}
  .option.correct{border-color:var(--success);background:var(--success-soft);}
  .option.incorrect{border-color:var(--error);background:var(--error-soft);}
  .option-letter{width:26px;height:26px;border-radius:50%;background:var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;color:var(--text-sec);}
  .option.correct .option-letter{background:var(--success);color:#fff;}
  .option.incorrect .option-letter{background:var(--error);color:#fff;}
  .feedback-box{margin-top:18px;padding:16px 18px;border-radius:var(--radius-md);font-size:13.5px;line-height:1.55;}
  .feedback-box.ok{background:var(--success-soft);color:#175c2c;}
  .feedback-box.bad{background:var(--error-soft);color:#8a201a;}
  .feedback-ref{margin-top:8px;font-size:12.5px;color:var(--text-sec);font-style:normal;}

  .result-hero{text-align:center;padding:20px 0 8px 0;}
  .result-score{font-size:56px;font-weight:800;letter-spacing:-0.03em;}
  .result-score.good{color:var(--success);}
  .result-score.mid{color:#a05a00;}
  .result-score.bad{color:var(--error);}
  .result-label{font-size:15px;color:var(--text-sec);margin-top:2px;}

  .history-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .history-table th{text-align:left;padding:9px 10px;color:var(--text-tert);font-weight:600;font-size:12px;border-bottom:1px solid var(--border-soft);}
  .history-table td{padding:11px 10px;border-bottom:1px solid var(--border-soft);}
  .history-table tr:last-child td{border-bottom:none;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-tert);}
  .empty-state svg{width:44px;height:44px;margin-bottom:14px;opacity:.5;}
  .empty-state p{font-size:14px;margin:0;}

  input.text-field{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);}
  input.text-field:focus{outline:none;border-color:var(--accent);}
  label.field-label{font-size:13px;font-weight:600;color:var(--text-sec);display:block;margin-bottom:8px;}

  .test-choice-card{padding:20px;border:1.5px solid var(--border-soft);border-radius:var(--radius-md);cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .test-choice-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
  .test-choice-title{font-size:15px;font-weight:600;margin-bottom:4px;}
  .test-choice-sub{font-size:12.5px;color:var(--text-sec);}

  /* Editor de texto enriquecido (modo edición) */
  .rich-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:8px;background:var(--card-2);border:1px solid var(--border-soft);border-bottom:none;border-top-left-radius:var(--radius-sm);border-top-right-radius:var(--radius-sm);}
  .rich-toolbar select{padding:6px 8px;border-radius:8px;border:1px solid var(--border-soft);font-size:12.5px;font-family:inherit;background:#fff;color:var(--text);}
  .rich-toolbar button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-sec);background:transparent;min-width:30px;}
  .rich-toolbar button:hover{background:var(--border-soft);color:var(--text);}
  .rich-toolbar .sep{width:1px;align-self:stretch;background:var(--border-soft);margin:2px 4px;}
  .rich-editor{min-height:220px;padding:14px 16px;border:1px solid var(--border);border-top:none;border-bottom-left-radius:var(--radius-sm);border-bottom-right-radius:var(--radius-sm);font-size:14.5px;line-height:1.6;color:var(--text);}
  .rich-editor:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .rich-content h1{font-size:22px;font-weight:700;margin:18px 0 10px;letter-spacing:-0.01em;}
  .rich-content h2{font-size:19px;font-weight:700;margin:16px 0 8px;}
  .rich-content h3{font-size:17px;font-weight:700;margin:14px 0 8px;}
  .rich-content h4{font-size:15.5px;font-weight:700;margin:12px 0 6px;}
  .rich-content h5{font-size:14.5px;font-weight:700;margin:10px 0 6px;}
  .rich-content h6{font-size:13.5px;font-weight:700;margin:10px 0 6px;color:var(--text-sec);}
  .rich-content p{margin:0 0 10px 0;}
  .rich-content ul, .rich-content ol{margin:0 0 10px 0;padding-left:22px;}
  .rich-content li{margin-bottom:5px;}
  .rich-content:empty:before{content:'Escribe aquí el contenido de estudio…';color:var(--text-tert);}

  .db-banner{position:sticky;top:0;left:0;right:0;z-index:300;background:#fdeceb;border-bottom:1px solid #f3b4ac;color:#8a201a;padding:12px 24px;font-size:13px;line-height:1.55;}
  .db-banner b{font-weight:700;}
  .db-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px;}

    contenidoEstudio:"<h4>La Carta de las Naciones Unidas</h4><p>La <b>Carta de las Naciones Unidas</b> es el tratado internacional constitutivo de la Organización de las Naciones Unidas (ONU).</p><p>Fue firmada en <b>San Francisco el 26 de junio de 1945</b>, al finalizar la Conferencia de las Naciones Unidas sobre Organización Internacional, y entró en vigor el <b>24 de octubre de 1945</b>, fecha que se conmemora como Día de las Naciones Unidas.</p><p>El Estatuto de la <b>Corte Internacional de Justicia</b> forma parte integrante de la Carta.</p><p>La Carta establece los propósitos y principios fundamentales de la Organización, determina la condición de sus miembros, regula sus órganos principales y establece mecanismos para el mantenimiento de la paz y la seguridad internacionales, la cooperación internacional y la solución pacífica de controversias.</p><h4>Propósitos de las Naciones Unidas</h4><p>El artículo 1 de la Carta establece cuatro grandes propósitos:</p><ol class='clean'><li><b>Mantener la paz y la seguridad internacionales</b>, adoptando medidas colectivas eficaces para prevenir y eliminar amenazas a la paz y suprimir actos de agresión, así como lograr por medios pacíficos el arreglo de controversias internacionales.</li><li><b>Fomentar relaciones de amistad entre las naciones</b>, basadas en el respeto al principio de igualdad de derechos y a la libre determinación de los pueblos.</li><li><b>Realizar la cooperación internacional</b> para resolver problemas económicos, sociales, culturales o humanitarios y promover el respeto de los derechos humanos y las libertades fundamentales.</li><li><b>Servir de centro que armonice los esfuerzos de las naciones</b> para alcanzar estos propósitos comunes.</li></ol><h4>Principios de las Naciones Unidas</h4><p>El artículo 2 establece, entre otros, los siguientes principios:</p><ul class='clean'><li>Igualdad soberana de todos sus miembros.</li><li>Cumplimiento de buena fe de las obligaciones contraídas conforme a la Carta.</li><li>Solución pacífica de las controversias internacionales.</li><li>Prohibición de recurrir a la amenaza o al uso de la fuerza contra la integridad territorial o la independencia política de cualquier Estado.</li><li>Obligación de prestar ayuda a la ONU en las acciones que emprenda conforme a la Carta.</li><li>Principio de no intervención de la Organización en asuntos que sean esencialmente de la jurisdicción interna de los Estados, sin perjuicio de las medidas coercitivas previstas en el Capítulo VII.</li></ul><p>La Carta constituye, por tanto, el marco jurídico fundamental de la organización y de la cooperación internacional en materia de paz, seguridad y derechos humanos.</p><h4>Órganos principales</h4><p>El artículo 7 de la Carta establece seis <b>órganos principales</b>:</p><ol class='clean'><li><b>Asamblea General.</b></li><li><b>Consejo de Seguridad.</b></li><li><b>Consejo Económico y Social.</b></li><li><b>Consejo de Administración Fiduciaria.</b></li><li><b>Corte Internacional de Justicia.</b></li><li><b>Secretaría.</b></li></ol><p>La Carta permite además establecer órganos subsidiarios cuando sean necesarios para el cumplimiento de sus funciones.</p><h4>Asamblea General</h4><p>La <b>Asamblea General</b> es el órgano deliberativo, normativo y representativo de la ONU.</p><p>Está integrada por <b>todos los Estados miembros</b> de las Naciones Unidas. Cada Estado puede tener hasta cinco representantes, pero dispone de <b>un voto</b>.</p><p>Entre sus competencias se encuentran:</p><ul class='clean'><li>Examinar los principios generales de cooperación para el mantenimiento de la paz y la seguridad.</li><li>Formular recomendaciones a los Estados miembros o al Consejo de Seguridad.</li><li>Examinar cuestiones relativas a la cooperación internacional.</li><li>Aprobar el presupuesto de la Organización.</li><li>Elegir a determinados miembros de otros órganos.</li><li>Admitir nuevos miembros por recomendación del Consejo de Seguridad.</li><li>Elegir, junto con el Consejo de Seguridad, a los jueces de la Corte Internacional de Justicia.</li><li>Nombrar al Secretario General a recomendación del Consejo de Seguridad.</li></ul><p>En las cuestiones importantes, las decisiones se adoptan por <b>mayoría de dos tercios de los miembros presentes y votantes</b>. Para las demás cuestiones se requiere mayoría de los miembros presentes y votantes.</p><h4>Consejo de Seguridad</h4><p>El <b>Consejo de Seguridad</b> tiene la responsabilidad primordial del mantenimiento de la paz y la seguridad internacionales.</p><p>Está compuesto por <b>15 miembros</b>:</p><ul class='clean'><li><b>5 permanentes:</b> China, Estados Unidos, Federación de Rusia, Francia y Reino Unido.</li><li><b>10 no permanentes</b>, elegidos por la Asamblea General por un período de <b>dos años</b>.</li></ul><p>Los miembros no permanentes se eligen teniendo especialmente en cuenta la contribución de los Estados al mantenimiento de la paz y la seguridad internacionales y una distribución geográfica equitativa.</p><p>En las cuestiones de procedimiento son necesarios <b>9 votos afirmativos</b>.</p><p>En las demás cuestiones son necesarios <b>9 votos afirmativos, incluidos los votos de los miembros permanentes</b>.</p><p>La abstención de un miembro permanente <b>no equivale a veto</b>. El veto se produce cuando un miembro permanente emite un voto negativo en una cuestión sustantiva.</p><p>Las decisiones del Consejo de Seguridad adoptadas conforme a la Carta obligan a los Estados miembros en los términos establecidos por el artículo 25.</p><h4>Consejo Económico y Social</h4><p>El <b>Consejo Económico y Social (ECOSOC)</b> coordina la labor económica y social de la ONU y de su sistema de organismos especializados.</p><p>Está compuesto por <b>54 miembros</b>, elegidos por la Asamblea General por períodos de <b>tres años</b>.</p><p>Entre sus funciones se encuentran:</p><ul class='clean'><li>Realizar estudios e informes sobre cuestiones económicas, sociales, culturales, educativas y sanitarias.</li><li>Formular recomendaciones a la Asamblea General, a los Estados y a los organismos especializados.</li><li>Promover el respeto de los derechos humanos.</li><li>Coordinar las actividades del sistema de Naciones Unidas en las materias de su competencia.</li></ul><h4>Consejo de Administración Fiduciaria</h4><p>El <b>Consejo de Administración Fiduciaria</b> fue creado para supervisar la administración de los territorios en régimen internacional de administración fiduciaria y favorecer su evolución hacia el autogobierno o la independencia.</p><p>El sistema de administración fiduciaria cumplió su finalidad con la evolución de los territorios sometidos a dicho régimen.</p><p>El Consejo <b>suspendió sus operaciones el 1 de noviembre de 1994</b>, después de que Palau, el último territorio en fideicomiso de las Naciones Unidas, alcanzara la independencia.</p><p>Aunque continúa siendo uno de los seis órganos principales de la ONU, actualmente no desarrolla actividad operacional ordinaria.</p><h4>Corte Internacional de Justicia</h4><p>La <b>Corte Internacional de Justicia (CIJ)</b> es el principal órgano judicial de las Naciones Unidas.</p><p>Tiene su sede en <b>La Haya</b>.</p><p>Está compuesta por <b>15 jueces</b>, elegidos por la Asamblea General y el Consejo de Seguridad por períodos de <b>nueve años</b>.</p><p>Sus funciones principales son:</p><ul class='clean'><li>Resolver controversias jurídicas entre Estados que hayan aceptado su jurisdicción.</li><li>Emitir opiniones consultivas sobre cuestiones jurídicas que le sean sometidas por los órganos y organismos autorizados.</li></ul><p>La Corte resuelve controversias entre <b>Estados</b>, no procesos penales contra particulares.</p><h4>Secretaría</h4><p>La <b>Secretaría</b> es uno de los órganos principales de las Naciones Unidas y desarrolla el trabajo administrativo, técnico y operativo de la Organización.</p><p>Está encabezada por el <b>Secretario General</b>, que es el más alto funcionario administrativo de la ONU.</p><p>El Secretario General:</p><ul class='clean'><li>Actúa como representante de la Organización.</li><li>Desempeña funciones diplomáticas.</li><li>Participa en la prevención y solución de conflictos.</li><li>Puede llamar la atención del Consejo de Seguridad sobre cuestiones que, a su juicio, puedan amenazar la paz y la seguridad internacionales.</li><li>Dirige la Secretaría.</li></ul><p>El Secretario General es nombrado por la <b>Asamblea General a recomendación del Consejo de Seguridad</b>.</p><h4>Órganos subsidiarios</h4><p>La ONU puede crear órganos subsidiarios cuando sean necesarios para el desempeño de sus funciones. Entre ellos se encuentran numerosos comités, programas, fondos y organismos creados mediante decisiones de los órganos principales. Estos órganos no deben confundirse con los seis órganos principales establecidos directamente por el artículo 7 de la Carta.</p>",

    id:"1-2", titulo:"Declaración Universal de Derechos Humanos.",
    contenidoEstudio:"<h4>Origen y naturaleza</h4><p>La <b>Declaración Universal de Derechos Humanos (DUDH)</b> fue proclamada por la Asamblea General de las Naciones Unidas en <b>París el 10 de diciembre de 1948</b>, mediante la <b>Resolución 217 A (III)</b>.</p><p>Constituye uno de los principales instrumentos internacionales de referencia en materia de derechos humanos.</p><p>La Declaración está formada por un <b>Preámbulo y 30 artículos</b>.</p><p>Su finalidad es establecer un ideal común de respeto universal y efectivo de los derechos y libertades fundamentales.</p><h4>Principios fundamentales</h4><p>La Declaración parte del reconocimiento de:</p><ul class='clean'><li>La dignidad inherente a todos los seres humanos.</li><li>La igualdad de derechos.</li><li>El carácter universal de los derechos humanos.</li><li>La libertad.</li><li>La justicia.</li><li>La paz.</li><li>La prohibición de discriminación.</li></ul><p>El artículo 1 establece que todos los seres humanos nacen libres e iguales en dignidad y derechos y que deben comportarse fraternalmente los unos con los otros.</p><h4>Derechos y libertades reconocidos</h4><h4 style='font-size:14.5px;'>Artículos 1 a 11</h4><p>Reconocen fundamentalmente:</p><ul class='clean'><li>Igualdad y libertad.</li><li>Prohibición de discriminación.</li><li>Derecho a la vida, libertad y seguridad.</li><li>Prohibición de la esclavitud.</li><li>Prohibición de la tortura y de tratos crueles, inhumanos o degradantes.</li><li>Derecho al reconocimiento de la personalidad jurídica.</li><li>Igualdad ante la ley.</li><li>Derecho a un recurso efectivo.</li><li>Prohibición de detenciones, prisiones o destierros arbitrarios.</li><li>Derecho a un juicio público y justo ante tribunal independiente e imparcial.</li><li>Presunción de inocencia.</li><li>Principio de legalidad penal y prohibición de penas retroactivas.</li></ul><h4 style='font-size:14.5px;'>Artículos 12 a 17</h4><p>Comprenden derechos relacionados con:</p><ul class='clean'><li>Protección frente a injerencias arbitrarias en la vida privada.</li><li>Honor y reputación.</li><li>Inviolabilidad del domicilio.</li><li>Secreto de la correspondencia.</li><li>Libertad de circulación.</li><li>Derecho de asilo.</li><li>Derecho a una nacionalidad.</li><li>Derecho a contraer matrimonio y fundar una familia.</li><li>Igualdad en el matrimonio.</li><li>Derecho a la propiedad.</li></ul><h4 style='font-size:14.5px;'>Artículos 18 a 21</h4><p>Reconocen derechos civiles y políticos:</p><ul class='clean'><li>Libertad de pensamiento, conciencia y religión.</li><li>Libertad de opinión y expresión.</li><li>Derecho a buscar, recibir y difundir informaciones e ideas.</li><li>Libertad de reunión y asociación pacíficas.</li><li>Derecho a participar en el gobierno.</li><li>Derecho de acceso a las funciones públicas.</li><li>Derecho a elecciones auténticas, periódicas y mediante sufragio universal e igual.</li></ul><h4 style='font-size:14.5px;'>Artículos 22 a 27</h4><p>Recogen derechos económicos, sociales y culturales:</p><ul class='clean'><li>Derecho a la seguridad social.</li><li>Derecho al trabajo, libre elección, protección contra el desempleo.</li><li>Igual salario por trabajo igual, remuneración equitativa.</li><li>Derecho a fundar sindicatos y sindicarse.</li><li>Derecho al descanso y vacaciones.</li><li>Derecho a un nivel de vida adecuado (salud, alimentación, vivienda, asistencia médica y social).</li><li>Derecho a la educación, gratuidad de la enseñanza elemental y fundamental.</li><li>Derecho a participar en la vida cultural.</li></ul><h4 style='font-size:14.5px;'>Artículos 28 a 30</h4><p>Establecen:</p><ul class='clean'><li>Derecho a un orden social e internacional en el que los derechos puedan hacerse efectivos.</li><li>Deberes respecto de la comunidad.</li><li>Límites al ejercicio de los derechos para asegurar los derechos de los demás y las exigencias de la moral, el orden público y el bienestar general en una sociedad democrática.</li><li>Prohibición de interpretar la Declaración de manera que permita destruir los derechos y libertades reconocidos.</li></ul>",

    id:"1-3", titulo:"Convenio europeo para la protección de los Derechos Humanos y de las Libertades Fundamentales. Tribunal Europeo de Derechos Humanos.",
    contenidoEstudio:"<h4>El Convenio Europeo de Derechos Humanos</h4><p>El <b>Convenio para la Protección de los Derechos Humanos y de las Libertades Fundamentales</b>, conocido como <b>Convenio Europeo de Derechos Humanos (CEDH)</b>, fue firmado en <b>Roma el 4 de noviembre de 1950</b> en el ámbito del Consejo de Europa.</p><p>Entró en vigor el <b>3 de septiembre de 1953</b>.</p><p>Su finalidad es garantizar determinados derechos humanos y libertades fundamentales mediante un sistema internacional de protección.</p><p>España es Estado parte del Convenio.</p><h4>Derechos protegidos</h4><p>Entre los derechos y libertades protegidos se encuentran:</p><ul class='clean'><li>Derecho a la vida.</li><li>Prohibición de la tortura.</li><li>Prohibición de la esclavitud y del trabajo forzado.</li><li>Derecho a la libertad y seguridad.</li><li>Derecho a un proceso equitativo.</li><li>Principio de legalidad penal.</li><li>Derecho al respeto de la vida privada y familiar.</li><li>Libertad de pensamiento, conciencia y religión.</li><li>Libertad de expresión.</li><li>Libertad de reunión y asociación.</li><li>Derecho a contraer matrimonio.</li><li>Derecho a un recurso efectivo.</li><li>Prohibición de discriminación.</li></ul><p>Los derechos se completan y desarrollan mediante los <b>Protocolos adicionales</b> al Convenio.</p><h4>Tribunal Europeo de Derechos Humanos</h4><p>El <b>Tribunal Europeo de Derechos Humanos (TEDH)</b> es un tribunal internacional permanente encargado de garantizar el cumplimiento del Convenio y sus Protocolos por los Estados que son parte.</p><p>Tiene su sede en <b>Estrasburgo</b>.</p><p>El Tribunal está compuesto por <b>un juez por cada Estado parte del Convenio</b>.</p><p>Los jueces actúan a título individual y no representan a sus Estados.</p><p>Son elegidos por la Asamblea Parlamentaria del Consejo de Europa a partir de una lista de candidatos presentada por cada Estado.</p><p>Su mandato es de <b>nueve años</b> y no pueden ser reelegidos.</p><h4>Competencia</h4><p>El TEDH conoce fundamentalmente de:</p><ul class='clean'><li>Demandas individuales.</li><li>Demandas interestatales.</li></ul><p>Puede examinar si un Estado ha vulnerado los derechos reconocidos por el Convenio o sus Protocolos aplicables.</p><h4>Demanda individual</h4><p>Cualquier persona física, organización no gubernamental o grupo de particulares que se considere víctima de una violación de los derechos reconocidos por el Convenio puede presentar una demanda contra un Estado parte, siempre que se cumplan los requisitos de admisibilidad.</p><p>Entre las condiciones esenciales se encuentra haber <b>agotado los recursos internos efectivos disponibles</b>.</p><p>La demanda debe presentarse dentro del plazo establecido por el Convenio, actualmente de <b>cuatro meses desde la fecha de la decisión interna definitiva</b>.</p><h4>Sentencias del Tribunal</h4><p>Las sentencias definitivas del TEDH son obligatorias para los Estados parte en el litigio.</p><p>El Estado condenado debe adoptar las medidas necesarias para dar cumplimiento a la sentencia.</p><p>La ejecución de las sentencias es supervisada por el <b>Comité de Ministros del Consejo de Europa</b>.</p><p>El TEDH no funciona como una instancia ordinaria de apelación respecto de los tribunales nacionales.</p>",
    conceptos:[],
    normativa:[{norma:"Convenio Europeo de Derechos Humanos", detalle:"Roma, 4 de noviembre de 1950. En vigor desde el 3 de septiembre de 1953. Consejo de Europa.", url:"https://www.echr.coe.int/documents/d/echr/50questions_spa"}],
    datos:["Firma: Roma, 4 de noviembre de 1950 · Entrada en vigor: 3 de septiembre de 1953","TEDH: 1 juez por Estado parte, elegido por la Asamblea Parlamentaria del Consejo de Europa, mandato de 9 años no renovable, sede Estrasburgo","Demanda individual: requiere agotar recursos internos y presentarse en un plazo de 4 meses desde la resolución interna definitiva","Ejecución de sentencias: supervisada por el Comité de Ministros del Consejo de Europa"],
    advertencias:["No confundir el Consejo de Europa (creó el CEDH) con el Consejo Europeo o el Consejo de la UE, instituciones de la Unión Europea.","El TEDH no es una instancia de apelación de los tribunales nacionales: solo controla el cumplimiento del Convenio, tras agotar la vía interna.","La ejecución de las sentencias la supervisa el Comité de Ministros, no el propio Tribunal."],
    fuentes:[{texto:"Convenio Europeo de Derechos Humanos — Consejo de Europa (echr.coe.int)", url:"https://www.echr.coe.int/documents/d/echr/50questions_spa"}],
    resumen:"<p><b>Roma, 4-XI-1950</b>, vigor 3-IX-1953.</p><p>TEDH: 1 juez/Estado, 9 años no renovable, sede Estrasburgo. Demanda individual: agotar vía interna + plazo 4 meses. Ejecución: Comité de Ministros.</p>"

  {
    id:"1-4", titulo:"Carta Social Europea (revisada).",
    contenidoEstudio:"<h4>Concepto y finalidad</h4><p>La <b>Carta Social Europea (revisada)</b> es un tratado del Consejo de Europa destinado a garantizar derechos sociales y económicos fundamentales.</p><p>Fue hecha en <b>Estrasburgo el 3 de mayo de 1996</b>.</p><p>Para España entró en vigor el <b>1 de julio de 2021</b>.</p><p>Completa la protección de los derechos civiles y políticos proporcionada por el Convenio Europeo de Derechos Humanos mediante la protección de derechos sociales.</p><h4>Derechos protegidos</h4><p>La Carta reconoce, entre otros:</p><ul class='clean'><li>Derecho al trabajo.</li><li>Derecho a unas condiciones de trabajo equitativas.</li><li>Derecho a la seguridad e higiene en el trabajo.</li><li>Derecho a una remuneración equitativa.</li><li>Derecho de sindicación.</li><li>Derecho de negociación colectiva.</li><li>Protección de niños y jóvenes.</li><li>Protección de las trabajadoras durante la maternidad.</li><li>Derecho a la orientación y formación profesional.</li><li>Derecho a la protección de la salud.</li><li>Derecho a la seguridad social.</li><li>Derecho a la asistencia social y médica.</li><li>Derechos de las personas con discapacidad.</li><li>Derecho de la familia a protección social, jurídica y económica.</li><li>Derechos de los trabajadores migrantes y sus familias.</li><li>Derecho a la protección frente a la pobreza y la exclusión social.</li><li>Derecho a la vivienda.</li></ul><h4>Principio de no discriminación</h4><p>La Carta reconoce el disfrute de los derechos sociales sin discriminación y establece garantías específicas para determinados colectivos.</p><h4>Mecanismos de control</h4><p>El cumplimiento de la Carta se controla fundamentalmente mediante:</p><ul class='clean'><li>Informes periódicos de los Estados.</li><li>Procedimiento de reclamaciones colectivas, cuando resulte aplicable.</li></ul><p>El órgano especializado de control es el <b>Comité Europeo de Derechos Sociales</b>.</p><p>El Comité examina los informes nacionales y las reclamaciones colectivas y determina si la situación de un Estado es conforme con la Carta.</p>",
    conceptos:[],
    normativa:[{norma:"Carta Social Europea (revisada)", detalle:"Estrasburgo, 3 de mayo de 1996. En vigor en España desde el 1 de julio de 2021.", url:"https://www.boe.es/boe/dias/2021/06/11/pdfs/BOE-A-2021-9719.pdf"}],
    datos:["Hecha en: Estrasburgo, 3 de mayo de 1996","Entrada en vigor en España: 1 de julio de 2021","Órgano de control: Comité Europeo de Derechos Sociales","Mecanismos: informes periódicos + reclamaciones colectivas"],
    advertencias:["Completa al CEDH (derechos civiles y políticos) con derechos sociales y económicos: son dos tratados distintos y complementarios del Consejo de Europa.","No confundas el mecanismo de informes (obligatorio para todos) con el de reclamaciones colectivas (solo aplicable cuando el Estado lo ha aceptado)."],
    fuentes:[{texto:"BOE, Instrumento de Ratificación de la Carta Social Europea (revisada)", url:"https://www.boe.es/boe/dias/2021/06/11/pdfs/BOE-A-2021-9719.pdf"}],
    resumen:"<p><b>Estrasburgo, 3-V-1996</b> · vigor en España: 1-VII-2021.</p><p>Derechos sociales y económicos. Control: Comité Europeo de Derechos Sociales (informes + reclamaciones colectivas).</p>"
  },
  {
    id:"1-5", titulo:"Pacto Internacional de Derechos Económicos, Sociales y Culturales.",
    contenidoEstudio:"<h4>Concepto y origen</h4><p>El <b>Pacto Internacional de Derechos Económicos, Sociales y Culturales (PIDESC)</b> fue adoptado por la Asamblea General de las Naciones Unidas el <b>16 de diciembre de 1966</b>.</p><p>España lo ratificó y entró en vigor para España el <b>27 de julio de 1977</b>.</p><p>El Pacto reconoce derechos económicos, sociales y culturales y obliga a los Estados parte a adoptar medidas para hacerlos efectivos.</p><h4>Principio de realización progresiva</h4><p>Los Estados parte se comprometen a adoptar medidas, especialmente mediante legislación y cooperación internacional, utilizando hasta el máximo de los recursos de que dispongan, para lograr progresivamente la plena efectividad de los derechos reconocidos.</p><p>La realización progresiva no elimina las obligaciones inmediatas derivadas del Pacto, especialmente las relativas a la no discriminación y a determinados deberes de garantía.</p><h4>Derechos reconocidos</h4><p>El Pacto reconoce, entre otros:</p><ul class='clean'><li>Derecho al trabajo.</li><li>Derecho a condiciones de trabajo justas y favorables.</li><li>Derecho a fundar sindicatos y afiliarse.</li><li>Derecho a la seguridad social.</li><li>Protección de la familia.</li><li>Protección especial de madres antes y después del parto.</li><li>Protección de niños y adolescentes.</li><li>Derecho a un nivel de vida adecuado.</li><li>Derecho a la alimentación.</li><li>Derecho a la vivienda.</li><li>Derecho a la salud.</li><li>Derecho a la educación.</li><li>Derecho a participar en la vida cultural.</li><li>Derecho a beneficiarse del progreso científico.</li></ul><h4>Comité de Derechos Económicos, Sociales y Culturales</h4><p>El cumplimiento del Pacto es supervisado por el <b>Comité de Derechos Económicos, Sociales y Culturales</b> de Naciones Unidas.</p><p>El Comité examina los informes presentados por los Estados y formula observaciones y recomendaciones.</p><p>El <b>Protocolo Facultativo del PIDESC</b> establece, entre otros mecanismos, un procedimiento de comunicaciones individuales para los Estados que hayan aceptado el Protocolo.</p>",
    conceptos:[],
    normativa:[{norma:"Pacto Internacional de Derechos Económicos, Sociales y Culturales", detalle:"Nueva York, 16 de diciembre de 1966. Instrumento de ratificación de España depositado el 27 de abril de 1977 (BOE de 30 de abril de 1977); entrada en vigor para España el 27 de julio de 1977.", url:"https://www.boe.es/buscar/doc.php?id=BOE-A-1977-10734"}],
    datos:["Adopción: 16 de diciembre de 1966","Entrada en vigor para España: 27 de julio de 1977 (depósito de la ratificación: 27 de abril de 1977; BOE de publicación: 30 de abril de 1977)","Principio de realización progresiva, con obligaciones inmediatas de no discriminación","Órgano de control: Comité de Derechos Económicos, Sociales y Culturales","Protocolo Facultativo: comunicaciones individuales"],
    advertencias:["No confundas la fecha de publicación en el BOE (30 de abril de 1977) con la fecha de entrada en vigor para España (27 de julio de 1977): median tres meses, conforme al propio tratado.","El principio de realización progresiva no excusa el incumplimiento de las obligaciones inmediatas (no discriminación y garantías mínimas)."],
    fuentes:[{texto:"BOE-A-1977-10734, Instrumento de Ratificación de España del PIDESC", url:"https://www.boe.es/buscar/doc.php?id=BOE-A-1977-10734"}],
    resumen:"<p><b>Adoptado 16-XII-1966</b> · vigor España: 27-VII-1977.</p><p>Derechos económicos, sociales y culturales, realización progresiva. Control: Comité DESC + Protocolo Facultativo (comunicaciones individuales).</p>"
  },
  {
    id:"1-6", titulo:"Pacto Internacional de Derechos Civiles y Políticos.",
    contenidoEstudio:"<h4>Concepto y origen</h4><p>El <b>Pacto Internacional de Derechos Civiles y Políticos (PIDCP)</b> fue adoptado por la Asamblea General de Naciones Unidas el <b>16 de diciembre de 1966</b>.</p><p>España lo ratificó y entró en vigor para España el <b>27 de julio de 1977</b>.</p><p>El Pacto protege fundamentalmente derechos civiles y políticos.</p><h4>Derechos reconocidos</h4><p>Entre ellos:</p><ul class='clean'><li>Derecho a la vida.</li><li>Prohibición de la tortura.</li><li>Prohibición de tratos crueles, inhumanos o degradantes.</li><li>Prohibición de la esclavitud y servidumbre.</li><li>Libertad y seguridad personales.</li><li>Garantías frente a detenciones arbitrarias.</li><li>Derecho a ser oído por un tribunal competente, independiente e imparcial.</li><li>Presunción de inocencia.</li><li>Principio de legalidad penal.</li><li>Libertad de circulación.</li><li>Derecho a la intimidad.</li><li>Libertad de pensamiento, conciencia y religión.</li><li>Libertad de expresión.</li><li>Derecho de reunión pacífica.</li><li>Libertad de asociación.</li><li>Derecho a participar en los asuntos públicos.</li><li>Derecho al voto.</li><li>Igualdad ante la ley.</li><li>Prohibición de discriminación.</li><li>Derechos de las minorías étnicas, religiosas o lingüísticas.</li></ul><h4>Comité de Derechos Humanos</h4><p>El artículo 28 del Pacto establece el <b>Comité de Derechos Humanos</b>.</p><p>El Comité está integrado por <b>18 miembros</b>, elegidos entre personas de gran integridad moral y reconocida competencia en materia de derechos humanos.</p><p>Los miembros actúan a título personal y no como representantes de sus Estados.</p><p>El Comité examina los informes que presentan los Estados sobre las medidas adoptadas para aplicar el Pacto.</p><h4>Primer Protocolo Facultativo</h4><p>El <b>Primer Protocolo Facultativo del PIDCP</b> establece un sistema de comunicaciones individuales ante el Comité de Derechos Humanos para los Estados que sean parte del Protocolo.</p><p>Una persona que alegue ser víctima de una violación de los derechos reconocidos en el Pacto puede presentar una comunicación cuando se cumplan los requisitos establecidos.</p><h4>Segundo Protocolo Facultativo</h4><p>El <b>Segundo Protocolo Facultativo</b>, destinado a abolir la pena de muerte, compromete a los Estados parte con la abolición de la pena capital, en los términos establecidos en el propio Protocolo.</p>",
    conceptos:[],
    normativa:[{norma:"Pacto Internacional de Derechos Civiles y Políticos", detalle:"Nueva York, 16 de diciembre de 1966. Entrada en vigor para España: 27 de julio de 1977. Art. 28 (Comité de Derechos Humanos).", url:"https://www.boe.es/buscar/doc.php?id=BOE-A-1977-10733"}],
    datos:["Adopción: 16 de diciembre de 1966 · Entrada en vigor para España: 27 de julio de 1977 (misma fecha que el PIDESC)","Comité de Derechos Humanos: 18 miembros (art. 28), a título personal","Primer Protocolo Facultativo: comunicaciones individuales","Segundo Protocolo Facultativo: abolición de la pena de muerte"],
    advertencias:["PIDESC y PIDCP entraron en vigor para España en la MISMA fecha (27 de julio de 1977), al haberse ratificado y depositado conjuntamente — no los confundas con las fechas de entrada en vigor GENERAL de cada Pacto (3 de enero de 1976 el PIDESC y 23 de marzo de 1976 el PIDCP), que sí son distintas.","No confundas el Comité de Derechos Humanos (órgano de expertos del PIDCP, 18 miembros) con el Consejo de Derechos Humanos (órgano intergubernamental de la ONU, apartado 1-7)."],
    fuentes:[{texto:"BOE-A-1977-10733, Instrumento de Ratificación de España del PIDCP", url:"https://www.boe.es/buscar/doc.php?id=BOE-A-1977-10733"}],
    resumen:"<p><b>Adoptado 16-XII-1966</b> · vigor España: 27-VII-1977.</p><p>Comité de Derechos Humanos: 18 miembros. 1º Protocolo: comunicaciones individuales · 2º Protocolo: abolición pena de muerte.</p>"
